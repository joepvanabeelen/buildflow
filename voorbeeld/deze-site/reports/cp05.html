        <div class="volgende"><span class="eyebrow">${L.next}</span><p>${inline(nextText())}</p></div>
      </div>
      <div class="kpis">
        <div class="kpi"><span class="w">${s.passed}/${s.n}</span><span class="l">${L.cpPassedRun}</span></div>
        <div class="kpi"><span class="w">${one.gatesPassed}/${one.gates}</span><span class="l">${L.gatesPassed}</span></div>
        <div class="kpi"><span class="w">${one.tp}/${one.tt}</span><span class="l">${L.tests}</span></div>
        <div class="kpi"><span class="w">${one.fFixed}/${one.fTotal}</span><span class="l">${L.findings}</span></div>
        <div class="kpi"><span class="w">${b?tok(b.total_tokens):"–"}</span><span class="l">${L.tokens}</span></div>
        <div class="kpi"><span class="w">${b?usd(b.usd):"–"}</span><span class="l">${L.cost}</span></div>
        <div class="kpi"><span class="w">${dur(sc.active)}</span><span class="l">${L.active}</span></div>
      </div>
    </div></section>`;
  }
  const focusLabel = D.focus==="final" ? L.finalReport : D.focus ? `${L.cpReport} · ${D.focus}` : `${L.feature} · ${D.slug}`;
  return `<section class="hero" id="top"><div class="wrap">
    <div class="hero-grid">
      <div><span class="eyebrow">${esc(focusLabel)}</span><h1><span class="mark">${esc(D.title)}</span></h1>
        ${D.goal ? `<p class="lead">${inline(D.goal)}</p>` : ""}</div>
      <div class="volgende"><span class="eyebrow">${L.next}</span><p>${inline(nextText())}</p>${LIVE && !D.focus ? `<div id="bf-acties-slot"></div>` : ""}</div>
    </div>
    ${interruptNotice()}
    ${LIVE && !D.focus ? `<div id="bf-inbox-slot"></div>` : ""}
    ${stepper()}
    ${(D.checkpoints||[]).length ? `<div class="rail" aria-hidden="true">${(D.checkpoints||[]).map(c=>`<i class="${c.status}${c.id===activeId()?" actief":""}" title="${esc(c.id)} ${esc(c.title)}"></i>`).join("")}</div>
    <div class="kpis">
      <div class="kpi"><span class="w">${s.passed}/${s.n}</span><span class="l">${L.cpPassed}</span></div>
      <div class="kpi"><span class="w">${s.gatesPassed}/${s.gates}</span><span class="l">${L.gatesPassed}</span></div>
      <div class="kpi"><span class="w">${s.tp}/${s.tt}</span><span class="l">${L.tests}</span></div>
      <div class="kpi"><span class="w">${s.fFixed}/${s.fTotal}</span><span class="l">${L.findings}</span></div>
      <div class="kpi"><span class="w">${c?tok(c.totals.total_tokens):"–"}</span><span class="l">${L.tokens}</span></div>
      <div class="kpi"><span class="w">${c?usd(c.totals.usd):"–"}</span><span class="l">${L.cost}</span></div>
      <div class="kpi"><span class="w">${t?dur(t.active_seconds):"–"}</span><span class="l">${L.active}</span></div>
    </div>` : ""}
  </div></section>`;
}

function testsTable(tests){
  if(!tests || !tests.length) return `<p class="grijs klein">–</p>`;
  return `<div class="scroll"><table class="tabel stack"><thead><tr><th>${L.name}</th><th>${L.kind}</th><th>${L.covers}</th></tr></thead><tbody>
    ${tests.map(t => typeof t==="string" ? `<tr><td class="hoofd" colspan="3">${inline(t)}</td></tr>` : `<tr><td class="hoofd">${inline(t.name||t.title)}</td><td data-l="${L.kind}">${esc(t.kind||"")}</td><td data-l="${L.covers}">${inline(t.covers||t.given_when_then||"")}</td></tr>`).join("")}
  </tbody></table></div>`;
}

// ---- test-first: the planned scenarios (Given/When/Then) and the red -> green evidence of the behavior gate.
// bf puts a summary per checkpoint in D.tdd; data from an older bf has none, then only the test names show.
function tddOf(cp){
  const x = (D.tdd||{})[cp.id]; if(x) return x;
  const tests = (cp.tests||[]).map(t => typeof t==="string" ? {name:t} : t);
  return {scenarios: tests.map(t => ({name:t.name||t.title||"", kind:t.kind||"", scenario:null, done_when:[], covers:t.covers||"", text:t.given_when_then||"", state:"planned"})),
          planned:tests.length, with_scenario:0, red:null, green:null, red_confirmed:null, tests_new:null};
}
function scenarioItem(x, showState){
  const g = L.gwt, s = x.scenario;
  const dw = (x.done_when||[]).map(d => `<span class="dw"${d.text?` title="${esc(d.text)}"`:""}>${esc(fill(L.doneWhenN,{n:d.n}))}</span>`).join(" ");
  return `<li class="scenario st-${esc(x.state)}">
    <div class="sc-kop"><b class="sc-naam">${inline(x.name)}</b>${x.kind?`<span class="chip soort" title="${esc(x.kind)}">${esc((L.kindL||{})[x.kind]||x.kind)}</span>`:""}${showState?`<span class="sc-state ${esc(x.state)}">${esc(L.scL[x.state]||x.state)}</span>`:""}</div>
    ${s ? `<dl class="gwt"><dt>${esc(g[0])}</dt><dd>${inline(s.given)}</dd><dt>${esc(g[1])}</dt><dd>${inline(s.when)}</dd><dt>${esc(g[2])}</dt><dd>${inline(s.then)}</dd></dl>`
        : x.text ? `<p class="klein">${inline(x.text)}</p>` : ""}
    ${dw ? `<p class="klein grijs sc-dekt">${esc(L.provesL)}: ${dw}</p>` : x.covers ? `<p class="klein grijs sc-dekt">${esc(L.covers)}: ${inline(x.covers)}</p>` : ""}
    ${showState && x.red_reason && x.state!=="green" ? `<p class="klein grijs sc-rood">✕ ${inline(x.red_reason)}</p>` : ""}
  </li>`;
}
function scenarioBlock(cp){
  const td = tddOf(cp), sc = td.scenarios||[];
  const head = td.with_scenario ? L.scenarios : L.plannedTests;
  if(!sc.length) return `<div class="blok"><h4>${esc(head)} (0)</h4><p class="grijs klein">–</p></div>`;
  return `<div class="blok"><h4>${esc(head)} (${sc.length})</h4><ol class="scenarios">${sc.map(x => scenarioItem(x, cp.status!=="pending")).join("")}</ol></div>`;
}
function testFirstStrip(cp){
  const td = tddOf(cp);
  if(!td.planned && !td.red && !td.green && td.red_confirmed==null) return "";
  const r = td.red, g = td.green;
  const why = r ? (r.right_reason ? L.rightReason : r.right_reason===false ? L.wrongReason : L.reasonUnknown) : "";
  const redTxt = r ? `${fill(L.redN,{n:r.tests ?? "?"})} ${why}` : td.red_confirmed ? L.redFlag : L.notRecorded;
  const redCls = r ? (r.right_reason===false ? "fout" : "aan") : td.red_confirmed ? "aan" : "leeg";
  const greenTxt = g ? fill(L.greenN,{p:g.tests_passed ?? "?", n:g.tests_total ?? "?"}) : L.notYet;
  const fails = ((r && r.failures)||[]).slice(0,3);
  return `<div class="tdd" role="group" aria-label="${esc(L.testFirst)}">
    <div class="tdd-kop"><h4>${esc(L.testFirst)}</h4><p class="klein grijs">${esc(L.tddExplain)}</p></div>
    <ol class="tdd-stappen">
      <li class="tdd-stap rood ${redCls}"><span class="tdd-l">${esc(L.redL)}</span><span class="tdd-t">${esc(redTxt)}</span>${fails.length?`<ul class="tdd-fails klein" aria-label="${esc(L.firstFailures)}">${fails.map(f=>`<li>${f.test?`<b>${inline(f.test)}</b>: `:""}${inline(f.reason)}</li>`).join("")}</ul>`:""}</li>
      <li class="tdd-stap groen ${g?"aan":"leeg"}"><span class="tdd-l">${esc(L.greenL)}</span><span class="tdd-t">${esc(greenTxt)}</span></li>
    </ol></div>`;
}
function tddTotals(){
  const cps = D.checkpoints||[], rows = cps.map(c => [c, tddOf(c)]);
  if(!rows.some(([,x]) => x.planned || x.red || x.green)) return "";
  const sum = f => rows.reduce((a,[,x]) => a + (+f(x)||0), 0);
  const line = fill(L.tddTotalsLine, {scen:sum(x=>x.with_scenario), planned:sum(x=>x.planned), nw:sum(x=>x.tests_new),
    red:rows.filter(([,x]) => x.red_confirmed).length, n:cps.length});
  const yn = v => v ? L.yesL : v===false ? L.noL : "–";
  return `<h3 style="margin:28px 0 6px">${esc(L.tddTotals)}</h3>
    <p class="klein grijs" style="margin-bottom:6px">${esc(L.tddExplain)}</p><p class="klein" style="margin-bottom:10px"><b>${esc(line)}</b></p>
    <div class="scroll"><table class="tabel stack"><thead><tr><th>${L.checkpoints}</th><th class="r">${esc(L.thPlanned)}</th><th class="r">${esc(L.thScen)}</th><th class="r">${esc(L.thNew)}</th><th>${esc(L.thRed)}</th><th>${esc(L.thGreen)}</th></tr></thead><tbody>
    ${rows.map(([c,x]) => `<tr><td class="hoofd" data-l="#">${c.n}. <a href="#${c.id}">${esc(c.title)}</a></td><td class="r" data-l="${esc(L.thPlanned)}">${x.planned}</td><td class="r" data-l="${esc(L.thScen)}">${x.with_scenario}</td><td class="r" data-l="${esc(L.thNew)}">${x.tests_new ?? "–"}</td><td data-l="${esc(L.thRed)}">${esc(yn(x.red_confirmed))}</td><td data-l="${esc(L.thGreen)}">${x.green ? `${esc(x.green.tests_passed ?? "?")}/${esc(x.green.tests_total ?? "?")}` : "–"}</td></tr>`).join("")}
    </tbody></table></div>`;
}

function gateBlock(cp, g){
  const gs = gate(cp,g);
  if(gs.status==="skipped") return `<div class="blok"><h4><span title="${esc(g)}">${L[g]}</span> · <span class="grijs">${L.skipped}</span></h4><p class="klein grijs">${inline(known(gs.skip_reason||""))}</p></div>`;
  const at = gs.attempts||[];
  const last = at.length ? at[at.length-1] : null;
  return `<div class="blok"><h4><span title="${esc(g)}">${L[g]}</span> ${chip(cp,g)}</h4>
    ${g==="static" && last && last.checks ? checksTable(last.checks, last.metrics) : ""}
    ${at.length ? attemptsHtml(at) : `<p class="klein grijs">${L.noAttempts}</p>`}
  </div>`;
}
// the checks of the latest static run: one row per tool
// a tool that only finds what the baseline already had reads as clean; only new blocking findings look alarming
function checkResult(c){
  if(c.status==="crashed"||c.status==="timeout") return `<span class="chip failed">${esc((L.chkL||{})[c.status]||c.status)}</span>`;
  if(c.status==="skipped") return `<span class="chip skipped">${esc((L.chkL||{})[c.status])}</span>`;
  const nw = c.new, base = c.baseline||0;
  if(nw==null) return `<span class="chip ${c.status==="clean"?"passed":""}">${esc((L.chkL||{})[c.status]||c.status)}</span>`;
  if(!nw) return `<span class="chip passed">${esc(L.chkClean)}</span>${base?` <span class="klein grijs">${esc(fill(L.chkBase,{n:base}))}</span>`:""}`;
  return `<span class="chip ${c.blocking_new?"failed":""}">${esc(fill(L.chkNew,{n:nw}))}</span>${c.blocking_new?` <span class="klein">${esc(fill(L.chkBlockingNew,{n:c.blocking_new}))}</span>`:""}${base?` <span class="klein grijs">${esc(fill(L.chkBase,{n:base}))}</span>`:""}`;
}
function checksTable(checks, m){
  // runs from before bf split new and baseline per check: when the run had no new findings, what a tool found was baseline
  if(m && +m.new_findings===0) checks = checks.map(c => c.new==null && c.status==="findings" ? {...c, new:0, baseline:c.findings||0} : c);
  return `<div class="scroll"><table class="tabel stack checks"><thead><tr><th>${L.chkName}</th><th>${L.chkKind}</th><th>${L.chkStatus}</th><th class="r">${L.chkSecs}</th></tr></thead><tbody>
    ${checks.map(c => `<tr><td class="hoofd"><code class="naam">${esc(c.name)}</code></td><td data-l="${L.chkKind}">${esc((L.kindL||{})[c.kind]||c.kind||"")}</td><td data-l="${L.chkStatus}"><span class="uitslag">${checkResult(c)}${c.note?` <span class="grijs klein">${esc(c.note)}</span>`:""}</span></td><td class="r" data-l="${L.chkSecs}">${c.seconds!=null?esc(c.seconds)+"s":"–"}</td></tr>`).join("")}
  </tbody></table></div>`;
}
// the configured check set (approved with the plan) and, once building, the results per checkpoint
function staticBlock(withResults){
  const sc = D.static || {};
  const cps = D.checkpoints||[];
  if(sc.checks==null && !cps.some(c => (gate(c,"static").attempts||[]).length)) return "";
  const checks = sc.checks||[], bl = sc.baseline, na = sc.not_available||[];
  const cfg = sc.checks==null ? `<p class="klein grijs">${L.staticUnset}</p>`
    : !checks.length ? `<p class="klein">${L.staticNone}: ${inline(sc.reason||"–")}</p>`
    : `<div class="scroll"><table class="tabel stack"><thead><tr><th>${L.chkName}</th><th>${L.chkKind}</th><th>${L.chkScope}</th><th>${L.chkBlocking}</th></tr></thead><tbody>
        ${checks.map(c => `<tr><td class="hoofd"><code class="naam">${esc(c.name)}</code><div class="klein grijs"><code>${esc(c.cmd)}</code></div></td><td data-l="${L.chkKind}">${esc((L.kindL||{})[c.kind]||c.kind)}</td><td data-l="${L.chkScope}">${esc((L.scopeL||{})[c.scope]||c.scope)}</td><td data-l="${L.chkBlocking}">${c.blocking===false?esc(L.reportOnly):esc(L.blocksYes)}</td></tr>`).join("")}
      </tbody></table></div>
      <p class="klein grijs" style="margin-top:8px">${L.baseline}: ${bl ? `${bl.findings} ${L.preExisting} · <code>${esc((bl.commit||"").slice(0,10))}</code>` : L.noBaseline}</p>`;
  const rows = withResults ? cps.filter(c => gate(c,"static").status!=="pending" || (gate(c,"static").attempts||[]).length) : [];
  const res = rows.length ? `<div class="scroll" style="margin-top:14px"><table class="tabel stack"><thead><tr><th>${L.checkpoints}</th><th>${L.static}</th><th class="r">${L.newF}</th><th class="r">${L.blockingOpen}</th><th class="r">${L.fixed}</th><th class="r">${L.wontfix}</th><th class="r">${L.preExisting}</th><th class="r">${L.toolErrors}</th></tr></thead><tbody>
      ${rows.map(c => { const m = lastMetrics(c,"static"), gs = gate(c,"static"); const skip = gs.status==="skipped";
        return `<tr><td class="hoofd" data-l="#">${c.n}. <a href="#${c.id}">${esc(c.title)}</a></td><td data-l="${L.static}">${chip(c,"static")}${skip&&gs.skip_reason?` <span class="klein grijs">${esc(known(gs.skip_reason))}</span>`:""}</td>${["new_findings","blocking_open","fixed","wontfix","baseline_matched","tool_errors"].map((k,i)=>`<td class="r" data-l="${[L.newF,L.blockingOpen,L.fixed,L.wontfix,L.preExisting,L.toolErrors][i]}">${skip?"–":esc(m[k]||0)}</td>`).join("")}</tr>`; }).join("")}
    </tbody></table></div>` : "";
  return `<h3 style="margin:28px 0 6px">${L.staticTitle}</h3>
    <p class="klein grijs" style="margin-bottom:10px">${L.staticIntro}</p>
    ${cfg}
    ${na.length ? `<p class="klein grijs" style="margin-top:8px">${L.notAvailable}: ${na.map(n => `<code>${esc(n.name)}</code>${n.reason?` (${esc(n.reason)})`:""}`).join(", ")}</p>` : ""}
    ${res}`;
}

function cpCard(cp, open){
  const c = D.cost, b = c && c.by_checkpoint[cp.id], sec = c && c.time.checkpoint_seconds[cp.id];
  const planMode = D.phase==="awaiting_plan_approval" && !D.focus;
  const key = `bf:${D.slug}:fb:${cp.id}`;
  const act = cp.id === activeId();
  return `<details class="cp ${cp.status}${act?" actief":""}" ${open||act?"open":""} id="${cp.id}"${act?' aria-current="step"':""}>
    <summary><span class="nr">${cp.n}</span>
      <div><h3>${act ? `<span class="chip running">▶ ${esc(cp.status==="pending" ? L.nextCp : L.nowCp)}</span> ` : ""}${esc(cp.title)} ${cp.source==="feedback"?`<span class="chip feedback">${L.fromFeedback}</span>`:""}</h3><div class="sub">${inline(cp.summary)}</div></div>
      <div class="gates">${GATES.map(g=>chip(cp,g)).join("")}</div>
    </summary>
    <div class="cp-body">
      <div class="twee">
        ${cp.why ? `<div class="blok"><h4>${L.why}</h4><p>${inline(cp.why)}</p></div>` : ""}
        ${(cp.done_when||[]).length ? `<div class="blok"><h4>${L.doneWhen}</h4><ul class="check ${cp.status==="passed"?"done":""}">${cp.done_when.map(x=>`<li>${inline(x)}</li>`).join("")}</ul></div>` : ""}
      </div>
      ${cp.ui_scope ? `<p class="klein"><b>${esc(L.uiScope)}:</b> ${inline(cp.ui_scope)}</p>` : ""}
      ${cp.docs_scope ? `<p class="klein"><b>${esc(L.docsScope)}:</b> ${inline(cp.docs_scope)}</p>` : ""}
      ${cp.status!=="pending" ? testFirstStrip(cp) : ""}
      ${scenarioBlock(cp)}
      ${cp.status!=="pending" ? `<div class="blok"><h4>${L.gateResults}</h4><div class="twee">${GATES.map(g=>gateBlock(cp,g)).join("")}</div></div>` : ""}
      ${(cp.started_at) ? `<p class="klein grijs">${L.duration}: <b>${dur(sec)}</b> · ${L.cpCost}: <b>${b?usd(b.usd):"–"}</b> (${b?tok(b.total_tokens):"–"} ${L.tokens}) · ${L.commit}: <code>${esc((cp.commit||"–").slice(0,10))}</code>${cp.report && !D.focus?` · <a href="${esc(cp.report)}">${L.report}</a>`:""}</p>` : ""}
      ${planMode ? `<div class="feedback-box"><label class="klein" for="fb-${cp.id}"><b>${L.yourFeedback}</b></label><textarea id="fb-${cp.id}" data-key="${esc(key)}" data-cp="${cp.id}">${esc(store.get(key)||"")}</textarea>${fbButtons("fb-"+cp.id, false)}</div>` : ""}
    </div>
  </details>`;
}

function planSection(){
  const cps = D.checkpoints||[];
  if(!cps.length && phaseIdx() < 3) return "";
  const planMode = D.phase==="awaiting_plan_approval";
  const list = (title, arr) => arr && arr.length ? `<div class="blok"><h4>${title}</h4><ul class="check">${arr.map(q=>`<li>${typeof q==="string" ? inline(q) : inline(q.q||q.question||"") + (q.a||q.answer ? ` → <b>${inline(q.a||q.answer)}</b>` : "")}</li>`).join("")}</ul></div>` : "";
  const gkey = `bf:${D.slug}:fb:general`;
  return `<section class="sectie vlak" id="plan"><div class="wrap">
    <div class="kop"><div><span class="eyebrow">${L.checkpoints}</span><h2>${L.plan}</h2></div><p class="grijs">${L.planIntro}</p></div>
    ${cps.length ? `<div class="cps">${cps.map(c=>cpCard(c, planMode || c.status==="in_progress" || c.status==="blocked")).join("")}</div>` : `<div class="leeg">${L.empty}</div>`}
    <div class="twee" style="margin-top:22px">${list(L.questions, D.questions)}${list(L.assumptions, D.assumptions)}${list(L.outOfScope, D.out_of_scope)}</div>
    ${phaseIdx() < 4 ? staticBlock(false) : ""}
    ${planMode ? `<div class="feedback-box" style="margin-top:22px"><label for="fb-general"><b>${L.generalFeedback}</b></label><textarea id="fb-general" data-key="${esc(gkey)}" data-cp="general">${esc(store.get(gkey)||"")}</textarea>
      ${fbButtons("fb-general", true)}</div>` : ""}
  </div></section>`;
}

function featureDocsBlock(){
  const fd = stg("docs"), at = fd.attempts || [];
  if(phaseIdx() < 4 || (!at.length && D.phase!=="documenting")) return "";
  const cpFiles = (D.checkpoints||[]).flatMap(c => (c.gates.docs && c.gates.docs.attempts || []).flatMap(a => a.files||[]));
  const files = [...new Set([...cpFiles, ...at.flatMap(a => a.files||[]), stg("design").design_md, stg("design").prototype].filter(Boolean))];
  return `<h3 style="margin:28px 0 6px">${L.featureDocs} <span class="chip ${esc(fd.status||"pending")}">${esc(statL(fd.status||"pending"))}</span></h3>
    <p class="klein grijs" style="margin-bottom:10px">${L.featureDocsIntro}</p>
    ${at.length ? attemptsHtml(at) : ""}
    ${files.length ? `<div class="poging"><div class="poging-kop">${L.docFiles} (${files.length})</div>${files.map(f=>/*zonder-link*/["README.md"].includes(f) ? `<div class="klein"><code>${esc(f)}</code></div>` : `<div class="klein"><a href="${esc(relLink(f))}"><code>${esc(f)}</code></a></div>`).join("")}</div>` : ""}`;
}

function progressSection(){
  const cps = D.checkpoints||[];
  if(phaseIdx() < 4 && !cps.some(c=>c.status!=="pending")) return "";
  const fb = D.feedback||[];
  return `<section class="sectie" id="progress"><div class="wrap">
    <div class="kop"><div><span class="eyebrow">${L.gateResults}</span><h2>${L.progress}</h2></div></div>
    <div class="scroll"><table class="tabel stack"><thead><tr><th>${L.checkpoints}</th>${GATES.map(g=>`<th>${L[g]}</th>`).join("")}<th class="r">${L.findings}</th><th class="r">${L.duration}</th><th class="r">${L.cpCost}</th></tr></thead><tbody>
    ${cps.map(cp => { const f=allFindings(cp); const b=D.cost&&D.cost.by_checkpoint[cp.id]; return `<tr><td class="hoofd" data-l="#">${cp.n}. <a href="#${cp.id}">${esc(cp.title)}</a></td>${GATES.map(g=>`<td data-l="${L[g]}">${chip(cp,g)}</td>`).join("")}<td class="r" data-l="${L.findings}">${f.filter(x=>x.status==="fixed").length}/${f.length}</td><td class="r" data-l="${L.duration}">${dur(D.cost&&D.cost.time.checkpoint_seconds[cp.id])}</td><td class="r" data-l="${L.cpCost}">${b?usd(b.usd):"–"}</td></tr>`; }).join("")}
    </tbody></table></div>
    ${tddTotals()}
    ${staticBlock(true)}
    ${featureDocsBlock()}

function bars(map){

  return `<div class="bars">${rows.map(([k,b])=>`<div class="bar"><span class="lbl" title="${esc(k)}">${esc(roleL(k))}</span><span class="spoor"><span class="vul" style="width:${(b.usd/max*100).toFixed(1)}%;display:block"></span></span><span class="n">${usd(b.usd)} <span class="grijs klein">${tok(b.total_tokens)}</span></span></div>`).join("")}</div>`;
}

function render(){
  L = T[D.lang] || T.en;
  document.documentElement.lang = D.lang || "en";
  let body, parts;
  const early = phaseIdx() < 4;
  if(D.focus && D.focus!=="final"){
    const cp = (D.checkpoints||[]).find(c=>c.id===D.focus);
    body = hero() + `<section class="sectie vlak"><div class="wrap"><div class="cps">${cp?cpCard(cp,true):""}</div><p style="margin-top:18px"><a class="knop rand klein" href="../viewer.html">${L.back}</a></p></div></section>` + costSection();
  } else {
    const S = {brief:[briefSection,L.brief], design:[designSection,L.design], plan:[planSection,L.plan], progress:[progressSection,L.progress],
               costs:[costSection,L.costs], context:[contextSection,L.context], learnings:[learnSection,L.learnings]};
    const order = D.focus==="final" ? ["progress","costs","brief","design","plan","context","learnings"]
                : early ? (() => { const cur = ({1:"brief",2:"design",3:"plan"})[phaseIdx()];
                    const base = ["brief","design","plan","context","costs","learnings"];
                    return cur ? [cur, ...base.filter(k => k!==cur)] : base; })()
                : ["plan","progress","costs","brief","design","context","learnings"];
    parts = order.map(k => [k, S[k][0](), S[k][1]]).filter(x => x[1]);
    window.__nav = parts.map(([k,,lbl]) => [k, lbl]);
    body = hero() + parts.map(x=>x[1]).join("");
  }
  const openIds = [...document.querySelectorAll("details.cp[open]")].map(d=>d.id);
  $("#app").innerHTML = header() + body + footer();
  openIds.forEach(id => { const d=document.getElementById(id); if(d) d.open=true; });
  // when the run moves on to another checkpoint, that card opens even though preserve() restores the rest
  const act = activeId(); activeOverride = act && act !== lastActive ? act : null; lastActive = act;
  bindBoxes(document);
  document.querySelectorAll(".copy-fb").forEach(b => b.addEventListener("click", copyFeedback));
  renderLive();
  const frame = $("#proto");
  if(frame) document.querySelectorAll(".statenrij .chip[data-state]").forEach(c => c.addEventListener("click", e => {
    e.preventDefault(); frame.src = c.href;
    document.querySelectorAll(".statenrij .chip").forEach(x => x.classList.toggle("aan", x===c));
  }));
}

function copyFeedback(){
  const parts = [];
  document.querySelectorAll("textarea[data-cp]").forEach(t => {
    const v = t.value.trim(); if(!v || t.dataset.cp==="msg") return;
    if(t.dataset.cp==="general" || t.dataset.cp==="brief" || t.dataset.cp==="design") parts.unshift(`${t.dataset.cp==="general" ? L.fbGeneral : L[t.dataset.cp]}: ${v}`);
    else { const cp = D.checkpoints.find(c=>c.id===t.dataset.cp); parts.push(`${t.dataset.cp} (${cp?cp.title:""}): ${v}`); }
  });
  const stage = D.phase==="awaiting_brief_approval" ? "brief" : D.phase==="awaiting_design_approval" ? "design" : "plan";
  const txt = parts.length ? fill(L.fbCopyHead, {stage: String(L[stage]||stage).toLowerCase(), slug: D.slug}) + "\n\n" + parts.map(p=>"- "+p).join("\n") : "";
  if(!txt) return toast(L.noFeedback);
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>toast(L.copied)).catch(()=>{ window.prompt(L.copyPrompt, txt); });
}

let toastTimer;
function toast(m, err){
  const e = $("#toast"); e.textContent = m; e.classList.toggle("fout", !!err); e.classList.add("aan");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { e.classList.remove("aan"); setTimeout(() => { if(!e.classList.contains("aan")) e.textContent = ""; }, 300); }, err ? 6000 : 2600);
}

function bindBoxes(scope){
  scope.querySelectorAll("textarea[data-key]").forEach(t => t.addEventListener("input", () => { lastInput = Date.now(); store.set(t.dataset.key, t.value); }));
  scope.querySelectorAll(".send-fb").forEach(b => b.addEventListener("click", () => sendBox(b)));
}

// ---- live viewer (bf serve): everything below only runs when the page was served with a token
function api(path, body){
  const h = {"X-BF-Token": TOKEN};
  if(body) h["Content-Type"] = "application/json";
  return fetch(path, {method: body ? "POST" : "GET", headers: h, cache: "no-store", body: body ? JSON.stringify(body) : undefined})
    .then(r => r.json().catch(() => ({})).then(j => ({status: r.status, j})));
}
function errText(res){
  if(!res) return L.errOffline;
  const c = res.j && res.j.code;
  if(res.status === 403) return L.errToken;
  if(c === "duplicate") return L.errDup;
  if(c === "wrong_phase") return L.errPhase;
  if(c === "text_required") return L.errText;
  if(c === "too_large") return L.errSize;
  return (res.j && res.j.error) || ("HTTP " + res.status);
}
function post(body, btn){
  if(btn){ btn.disabled = true; btn.setAttribute("aria-busy","true"); }
  const done = () => { if(btn && btn.isConnected){ btn.disabled = false; btn.removeAttribute("aria-busy"); } };
  return api("/api/action", body).then(res => {
    done(); setLive(true);
    if(res.status === 200){ toast(L.sent); loadInbox(); return true; }
    toast(errText(res), true);
    if(res.j && res.j.code === "wrong_phase"){ VER = {}; }  // force a refresh on the next poll
    return false;
  }, () => { done(); setLive(false); toast(L.errOffline, true); return false; });
}
function currentCp(){ const c = (D.checkpoints||[]).find(x => x.status==="in_progress" || x.status==="blocked"); return c ? c.id : null; }
function sendBox(btn){
  const t = document.getElementById(btn.dataset.for); if(!t) return;
  const text = t.value.trim();
  if(!text){ toast(L.errText, true); t.focus(); return; }
  const cp = t.dataset.cp, body = {type:"feedback", text};
  if(cp==="brief" || cp==="design") body.stage = cp;
  else if(cp==="general") body.stage = "plan";
  else if(/^cp\d+$/.test(cp)){ body.stage = D.phase==="awaiting_plan_approval" ? "plan" : "checkpoint"; body.target = cp; }
  else if(cp==="msg"){
    if(D.phase==="awaiting_human_review") body.stage = "review";
    else { body.type = "message"; const c = currentCp(); if(c && (D.phase==="building"||D.phase==="paused")) body.target = c; }
  }
  post(body, btn).then(ok => { if(ok){ t.value = ""; store.set(t.dataset.key, ""); } });
}

    ${items.length ? `<ol class="inbox-lijst" aria-label="${esc(L.inbox)}">${items.map(x => `<li>

        ${x.text ? `<div class="tekst">${esc(x.text.length > 240 ? x.text.slice(0,240)+"…" : x.text)}</div>` : ""}
        ${x.note ? `<div class="noot klein">→ ${esc(x.note)}</div>` : ""}</li>`).join("")}</ol>`
      : `<p class="klein grijs">${esc(L.inboxEmpty)}</p>`}
  </section>`;
}
function renderLive(){
  if(!LIVE || D.focus) return;
  const a = $("#bf-acties-slot"), b = $("#bf-inbox-slot");
  if(a){
    a.innerHTML = actionsHtml();
    const k = $("#bf-keur"), ja = $("#bf-ja"), nee = $("#bf-nee");
    if(k) k.addEventListener("click", () => { confirming = true; renderLive(); const j = $("#bf-ja"); if(j) j.focus(); });
    if(nee) nee.addEventListener("click", () => { confirming = false; renderLive(); const k2 = $("#bf-keur"); if(k2) k2.focus(); });
    if(ja) ja.addEventListener("click", () => {
      const stage = STOP_STAGE[D.phase];
      post({type: stage==="review" ? "accept" : "approve", stage}, ja).then(() => { confirming = false; renderLive(); });
    });
  }
  if(b){ b.innerHTML = inboxHtml(); bindBoxes(b); }
}
// re-render without losing scroll position, open sections, focus or the caret in a feedback box
function preserve(fn){
  const a = document.activeElement, id = a && a.id, s = a && a.selectionStart, e = a && a.selectionEnd, y = window.scrollY;
  const open = [...document.querySelectorAll("details[id]")].map(d => [d.id, d.open]);
  fn();
  open.forEach(([i,o]) => { const d = document.getElementById(i); if(d && i !== activeOverride) d.open = o; });
  if(id){ const n = document.getElementById(id); if(n && n !== document.activeElement){ n.focus({preventScroll:true}); if(s != null && n.setSelectionRange) try{ n.setSelectionRange(s, e); }catch(_){} } }
  window.scrollTo(0, y);
}
function loadInbox(){
  return api("/api/inbox").then(res => {
    if(res.status===200 && res.j.items){ INBOX = res.j.items; preserve(renderLive); }
    else if(res.status===403 && !staleWarned){ staleWarned = true; toast(L.errToken, true); }
  }).catch(() => {});
}
function loadData(){
  return fetch("data.json?" + Date.now(), {cache:"no-store"}).then(r => r.json()).then(n => {
    n.cost = n.cost || D.cost; D = n; lastData = new Date(); confirming = false; preserve(render);
  });
}
function poll(){
  // typing in a box: wait a moment so a refresh never lands in the middle of a word
  if(Date.now() - lastInput < 1500) return setTimeout(poll, 800);
  fetch("/api/version", {cache:"no-store"}).then(r => r.json()).then(v => {
    setLive(true);
    const jobs = [];
    const old = VER; VER = v;
    if(v.inbox !== old.inbox) jobs.push(loadInbox());
    if(v.state !== old.state) jobs.push(loadData());
    return Promise.all(jobs);
  }).catch(() => setLive(false)).finally(() => setTimeout(poll, 2000));
}

if(!D){ document.getElementById("app").innerHTML = `<p style='padding:40px'>${esc(((navigator.language||"").startsWith("nl") ? T.nl : T.en).noData)}</p>`; return; }
if(D.overview){ renderOverview(); return; }
render();
// on first load, bring the active checkpoint into view, unless the page opened on an anchor or the user already moved
["wheel","touchstart","keydown","mousedown"].forEach(ev => addEventListener(ev, () => { userMoved = true; }, {once:true, passive:true}));
let autoScrolled = false;
function scrollToActive(again){
  if(D.focus || location.hash || userMoved || (again ? !autoScrolled : window.scrollY > 10)) return;
  const id = activeId(), el = id && document.getElementById(id);
  if(el){ el.scrollIntoView({block:"start"}); autoScrolled = true; }
}
requestAnimationFrame(() => scrollToActive(false));
if(location.protocol.startsWith("http") && !D.focus){
  if(TOKEN){
    // served by bf serve: interactive, and cheap refresh (poll a fingerprint, fetch data only when it changed)
    fetch("/api/ping", {cache:"no-store"}).then(r => r.json()).then(p => {
      if(!p.ok || p.slug !== D.slug) throw 0;
      LIVE = true; liveOk = true; preserve(render);
      scrollToActive(true);  // the live panels pushed the page down; correct the first-load scroll once
      autoScrolled = false; poll();
    }).catch(() => {});
  } else {
    // any other web server: plain refresh of data.json
    setInterval(() => fetch("data.json?"+Date.now()).then(r=>r.json()).then(n => {
      if(n.updated_at !== D.updated_at && !document.activeElement.matches("textarea")){ n.cost = n.cost || D.cost; D = n; render(); }
    }).catch(()=>{}), 4000);
  }
}
})();
</script>
