<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>buildflow website · cp05 · buildflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
:root{
  --accent:#FFCE1F; --accent-zacht:#FFF1B8; --accent-licht:#FFFAE6; --accent-diep:#8A6A00;
  --zwart:#141412; --inkt:#26251F; --grijs:#686559; --grijs-licht:#9C998D;
  --lijn:#E7E4DB; --vlak:#F7F6F2; --wit:#FFFFFF; --fout:#B42318; --fout-zacht:#FDECEA;
  --radius:14px; --radius-s:8px; --max:1200px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Source Sans 3','Segoe UI',system-ui,sans-serif;font-size:17px;line-height:1.55;color:var(--inkt);background:var(--wit);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.display{font-family:'Archivo','Arial Narrow',system-ui,sans-serif;color:var(--zwart);text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2rem,1.4rem + 2.4vw,3.4rem);font-weight:800;font-stretch:108%;line-height:1.04}
h2{font-size:clamp(1.5rem,1.2rem + 1.2vw,2.2rem);font-weight:800;font-stretch:106%;line-height:1.1}
h3{font-size:1.2rem;font-weight:750;line-height:1.25}
h4{font-size:1rem;font-weight:750}
a{color:inherit}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--zwart);outline-offset:3px;border-radius:4px}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.86em}
.wrap{max-width:var(--max);margin-inline:auto;padding-inline:clamp(16px,4vw,40px)}
.eyebrow{font-family:'Archivo',sans-serif;font-size:.74rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--grijs)}
.eyebrow,.prose,.md,.poging,.finding,code{overflow-wrap:anywhere}
.mark{background:linear-gradient(transparent 58%,var(--accent) 58%);padding:0 .08em}
.lead{font-size:1.18rem;line-height:1.5}
.grijs{color:var(--grijs)}
.klein{font-size:.9rem}

/* top bar + header */
.topbalk{background:var(--zwart);color:#DAD7CD;font-size:.86rem}
.topbalk .wrap{display:flex;gap:16px;align-items:center;justify-content:space-between;min-height:38px;flex-wrap:wrap}
.topbalk b{color:#fff}
.header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--lijn)}
.header .wrap{display:flex;align-items:center;gap:20px;min-height:64px;flex-wrap:wrap}
.woordmerk{display:flex;align-items:baseline;gap:.2em;font-family:'Archivo',sans-serif;color:var(--zwart);line-height:1;text-decoration:none}
.woordmerk b{font-weight:900;font-stretch:125%;font-size:1.45rem;letter-spacing:-.02em;position:relative;z-index:0}
.woordmerk b::after{content:'';position:absolute;left:-.06em;right:-.08em;bottom:.02em;height:.36em;background:var(--accent);z-index:-1}
.woordmerk span{font-weight:500;font-size:1.2rem}
.nav{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
.nav a{padding:8px 12px;border-radius:6px;font-weight:600;font-size:.95rem;text-decoration:none;white-space:nowrap}
.nav a:hover{background:var(--vlak)}
.nav a.actief{background:var(--accent-zacht);box-shadow:inset 0 -2px 0 var(--accent)}

/* pills, buttons */
.pil{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-family:'Archivo',sans-serif;font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.pil.geel{background:var(--accent);color:var(--zwart)}
.pil.zwart{background:var(--zwart);color:#fff}
.pil.rand{box-shadow:inset 0 0 0 1.5px var(--zwart);color:var(--zwart)}
.knop{text-decoration:none;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.95rem;padding:11px 20px;border-radius:999px;background:var(--accent);color:var(--zwart);white-space:nowrap;transition:transform .15s ease}
.knop:hover{transform:translateY(-1px)}
.knop.zwart{background:var(--zwart);color:#fff}
.knop.rand{background:transparent;box-shadow:inset 0 0 0 2px var(--zwart)}
.knop.klein{padding:7px 14px;font-size:.86rem}

/* sections */
.sectie{padding-block:clamp(40px,6vw,72px)}
.sectie.vlak{background:var(--vlak)}
.sectie.zwart{background:var(--zwart);color:#EDEBE4}
.sectie.zwart h2,.sectie.zwart h3,.sectie.zwart h4{color:#fff}
.sectie.zwart .eyebrow{color:var(--accent)}
.sectie.zwart .grijs{color:#B9B6AB}
.kop{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:26px}
.kop p{max-width:60ch}

.hero{padding-block:clamp(36px,5vw,64px) clamp(28px,4vw,48px)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:start}
.hero h1{margin:14px 0 16px}
.volgende{border:2px solid var(--zwart);border-radius:var(--radius);padding:20px 22px;background:var(--wit);box-shadow:6px 6px 0 var(--accent)}
.volgende .eyebrow{margin-bottom:8px;display:block}
.volgende p{font-weight:600}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;margin-top:28px}
@media (max-width:1100px){.kpis,.sectie.zwart .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}

.kpi{background:var(--wit);border:1px solid var(--lijn);border-radius:var(--radius);padding:16px 18px}
.kpi .w{font-family:'Archivo',sans-serif;font-weight:800;font-stretch:110%;font-size:clamp(1.3rem,1rem + 1vw,1.7rem);white-space:nowrap;color:var(--zwart);line-height:1.1;display:block}
.kpi .l{font-size:.84rem;color:var(--grijs)}
.sectie.zwart .kpi{background:#1F1E1B;border-color:#34322C}
.sectie.zwart .kpi .w{color:var(--accent)}
.sectie.zwart .kpi .l{color:#B9B6AB}

/* progress rail */
.rail{display:flex;gap:4px;margin-top:22px}
.rail i{flex:1;height:10px;border-radius:3px;background:var(--lijn)}
.rail i.passed{background:var(--zwart)}
.rail i.in_progress{background:var(--accent)}
.rail i.blocked{background:var(--fout)}

/* checkpoint cards */
.cps{display:grid;gap:12px}
.cp{background:var(--wit);border:1px solid var(--lijn);border-radius:var(--radius);overflow:hidden}
.cp.in_progress{border-color:var(--zwart);box-shadow:4px 4px 0 var(--accent)}
.cp.blocked{border-color:var(--fout)}
.cp summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 18px}
.cp summary::-webkit-details-marker{display:none}
.nr{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;background:var(--accent);font-family:'Archivo',sans-serif;font-weight:800;color:var(--zwart)}
.cp.passed .nr{background:var(--zwart);color:var(--accent)}
.cp h3{font-size:1.08rem}
.cp .sub{font-size:.93rem;color:var(--grijs);margin-top:2px}
.gates{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;white-space:nowrap;box-shadow:inset 0 0 0 1.5px var(--lijn);color:var(--grijs)}
.chip.passed{background:var(--zwart);color:var(--accent);box-shadow:none}
.chip.running{background:var(--accent);color:var(--zwart);box-shadow:none}
.chip.failed{background:var(--fout-zacht);color:var(--fout);box-shadow:inset 0 0 0 1.5px var(--fout)}
.chip.interrupted{background:var(--accent-licht);color:var(--accent-diep);box-shadow:none;border:1.5px dashed var(--accent-diep);padding:2px 9px}
.chip.skipped{box-shadow:inset 0 0 0 1.5px var(--lijn);color:var(--grijs-licht);text-decoration:line-through}
.chip.feedback{background:var(--accent-zacht);color:var(--accent-diep);box-shadow:none}
.cp-body{border-top:1px solid var(--lijn);padding:18px;display:grid;gap:18px;background:var(--accent-licht)}
.twee{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.blok h4{margin-bottom:6px}
ul.check{list-style:none;display:grid;gap:4px}
ul.check li{padding-left:24px;position:relative}
ul.check li::before{content:'';position:absolute;left:0;top:.45em;width:12px;height:12px;border-radius:3px;box-shadow:inset 0 0 0 2px var(--zwart)}
ul.check.done li::before{background:var(--zwart);box-shadow:inset 0 0 0 3px var(--accent)}
.tabel{width:100%;border-collapse:collapse;font-size:.92rem;background:var(--wit);border-radius:var(--radius-s);overflow:hidden}
.tabel th{font-family:'Archivo',sans-serif;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--grijs);text-align:left;padding:9px 12px;border-bottom:2px solid var(--zwart);background:var(--wit)}
.tabel td{padding:9px 12px;border-bottom:1px solid var(--lijn);vertical-align:top}
.tabel td.r,.tabel th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sectie.zwart .tabel{background:#1F1E1B}
.sectie.zwart .tabel th{background:#1F1E1B;color:#B9B6AB;border-color:var(--accent)}
.sectie.zwart .tabel td{border-color:#34322C}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.poging{background:var(--wit);border:1px solid var(--lijn);border-radius:var(--radius-s);padding:12px 14px;margin-top:8px}
.poging-kop{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:700}
.finding{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;font-size:.9rem;padding:6px 0;border-top:1px dashed var(--lijn)}
.sev{font-family:'Archivo';font-weight:800;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--vlak);height:fit-content}
.sev.blocker,.sev.critical,.sev.high,.sev.major{background:var(--fout);color:#fff}
.sev.medium{background:var(--accent)}
.feedback-box textarea{width:100%;min-height:70px;border:1.5px solid var(--lijn);border-radius:var(--radius-s);padding:10px 12px;background:var(--wit);resize:vertical}
.feedback-box textarea:focus{border-color:var(--zwart);outline:none}

/* bars */
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(90px,200px) minmax(0,1fr) auto;gap:12px;align-items:center;font-size:.92rem}
.bar .spoor{height:14px;background:#2A2925;border-radius:3px;overflow:hidden}
.bar .vul{height:100%;background:var(--accent);border-radius:3px;min-width:2px}
.bar .n{font-variant-numeric:tabular-nums;font-weight:700;color:#fff;white-space:nowrap}
.bar .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* stage stepper */
.stepper{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:26px;list-style:none}
.stap{border-top:5px solid var(--lijn);padding-top:8px;font-size:.84rem;color:var(--grijs-licht);min-width:0}
.stap b{display:block;font-family:'Archivo',sans-serif;font-weight:750;font-size:.92rem;color:var(--grijs)}
.stap.done{border-color:var(--zwart);color:var(--grijs)}
.stap.done b{color:var(--zwart)}
.stap.current{border-color:var(--accent)}
.stap.current b{color:var(--zwart)}
.stap.current span{color:var(--inkt);font-weight:600}
.stap.skipped{border-top-style:dotted}
.stap.skipped b{text-decoration:line-through;color:var(--grijs-licht)}
/* rendered markdown */
.prose{background:var(--wit);border:1px solid var(--lijn);border-radius:var(--radius);padding:clamp(16px,3vw,28px)}
.prose h1{font-size:1.5rem;margin:0 0 12px}.prose h2{font-size:1.2rem;margin:22px 0 8px}.prose h3{font-size:1.02rem;margin:18px 0 6px}
.prose h1:first-child,.prose h2:first-child{margin-top:0}
.prose p{margin:0 0 10px}.prose ul,.prose ol{margin:0 0 12px 1.2em}.prose li{margin:3px 0}
.prose code{background:var(--vlak);padding:1px 5px;border-radius:4px}
.prose a{text-decoration-color:var(--accent);text-decoration-thickness:2px}
details.ctx{background:var(--wit);border:1px solid var(--lijn);border-radius:var(--radius);margin-bottom:12px}
details.ctx summary{cursor:pointer;padding:14px 18px;font-weight:700;list-style:none;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px}
details.ctx summary::-webkit-details-marker{display:none}
details.ctx summary::after{content:'+';font-family:'Archivo';font-weight:800;margin-left:auto}
details.ctx[open] summary::after{content:'–'}
details.ctx .prose{border:0;border-top:1px solid var(--lijn);border-radius:0 0 var(--radius) var(--radius)}
.proto-frame{width:100%;height:640px;border:2px solid var(--zwart);border-radius:var(--radius);background:#fff;box-shadow:6px 6px 0 var(--accent)}
.statenrij{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.statenrij .chip{cursor:pointer;text-decoration:none;color:var(--inkt)}
.statenrij .chip.aan{background:var(--accent);color:var(--zwart);box-shadow:none}
.pad{display:block;margin-top:6px;word-break:break-all;color:var(--grijs)}
.melding{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-top:18px;padding:12px 14px;border-radius:var(--radius-s);background:var(--accent-licht);border:1.5px dashed var(--accent-diep);color:var(--inkt)}
.melding b{color:var(--accent-diep)}
.melding.hervat{background:var(--vlak);border:1px solid var(--lijn);color:var(--grijs);padding:8px 14px;font-size:.9rem}
.melding.hervat b{color:var(--grijs)}
.melding p{margin:0}
.melding-sluit{flex:none;width:32px;height:32px;margin:-4px -6px -4px 0;border-radius:6px;font-size:1.2rem;line-height:1;color:inherit}
.melding-sluit:hover{background:rgba(0,0,0,.06)}
.leeg{border:2px dashed var(--lijn);border-radius:var(--radius);padding:28px;text-align:center;color:var(--grijs)}
.md{white-space:pre-wrap;background:var(--wit);border:1px solid var(--lijn);border-radius:var(--radius);padding:18px 20px;font-size:.95rem}
.footer{background:var(--zwart);color:#B9B6AB;font-size:.86rem;padding-block:22px}
.footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--zwart);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.aan{opacity:1}
.toast.fout{background:var(--fout)}
.runregel{margin-top:28px;padding-top:14px;border-top:1px solid #34322C}

/* the checkpoint the run is on */
.cp.actief{border:2px solid var(--zwart);box-shadow:6px 6px 0 var(--accent)}
.cp.actief .nr{background:var(--zwart);color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
details.cp{scroll-margin-top:96px}
.rail i.actief{outline:2px solid var(--zwart);outline-offset:2px}
.terug{font-weight:600;font-size:.9rem;text-decoration:none;white-space:nowrap;padding:6px 10px;border-radius:6px}
.terug:hover{background:var(--vlak)}

/* overview of all runs (.buildflow/index.html) */
.runs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px}
.run-kaart{background:var(--wit);border:1px solid var(--lijn);border-radius:var(--radius);padding:18px 20px;display:grid;gap:10px;align-content:start;min-width:0}
.run-kaart.actief{border:2px solid var(--zwart);box-shadow:6px 6px 0 var(--accent)}
.run-kaart h3 a{text-decoration:none}
.run-kaart h3 a:hover{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px}
.run-kaart .rail{margin-top:2px}
.run-meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 14px;font-size:.9rem}
.run-meta dt{color:var(--grijs)}
.run-meta dd{font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.run-links{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.run-links .chip{text-decoration:none}
.run-links .chip:not(.passed):not(.failed){color:var(--inkt)}
.toast{max-width:calc(100vw - 32px);text-align:center;border-radius:18px}

/* live viewer (bf serve): actions and the inbox */
.knoppen{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:center}
.knop[disabled]{opacity:.55;cursor:progress;transform:none}
.live{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--grijs-licht);display:inline-block}
.live.aan i{background:var(--accent);box-shadow:0 0 0 3px rgba(255,206,31,.25)}
.live.uit{color:#F2A49C}
.acties{margin-top:14px;padding-top:14px;border-top:1.5px dashed var(--lijn)}
.acties .vraag{font-weight:700;margin-bottom:2px}
.acties .klaar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:600}
.inbox{margin-top:28px;border:2px solid var(--zwart);border-radius:var(--radius);background:var(--wit);padding:18px 20px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.inbox h3{margin-bottom:4px}
.inbox .feedback-box textarea{min-height:64px}
.inbox-lijst{list-style:none;display:grid;gap:8px;align-content:start}
.inbox-lijst li{border:1px solid var(--lijn);border-radius:var(--radius-s);padding:8px 12px;font-size:.92rem;background:var(--vlak);min-width:0}
.inbox-lijst .regel{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inbox-lijst .tekst{margin-top:4px;overflow-wrap:anywhere}
.inbox-lijst .noot{margin-top:4px;color:var(--grijs);overflow-wrap:anywhere}
.pil.st-new{background:var(--accent);color:var(--zwart)}
.pil.st-read{box-shadow:inset 0 0 0 1.5px var(--zwart);color:var(--zwart)}
.pil.st-handled{background:var(--zwart);color:#fff}
@media (max-width:820px){.inbox{grid-template-columns:1fr}}
@media (max-width:640px){.inbox{padding:14px}.knoppen .knop{white-space:normal;text-align:center}}

/* test-first: planned scenarios (Given/When/Then) and the red -> green strip */
ol.scenarios{list-style:none;display:grid;gap:8px}
.scenario{background:var(--wit);border:1px solid var(--lijn);border-left:4px solid var(--lijn);border-radius:var(--radius-s);padding:10px 14px;min-width:0}
.scenario.st-red,.scenario.st-red_wrong{border-left-color:var(--fout)}
.scenario.st-green{border-left-color:var(--zwart)}
.sc-kop{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.sc-naam{font-weight:700;overflow-wrap:anywhere;min-width:0}
.chip.soort{padding:1px 8px;font-size:.72rem}
.sc-state{margin-left:auto;font-family:'Archivo',sans-serif;font-weight:800;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:4px;background:var(--vlak);color:var(--grijs);white-space:nowrap}
.sc-state.red,.sc-state.red_wrong{background:var(--fout-zacht);color:var(--fout)}
.sc-state.green{background:var(--zwart);color:var(--accent)}
dl.gwt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;margin-top:6px;font-size:.93rem}
dl.gwt dt{font-family:'Archivo',sans-serif;font-weight:750;color:var(--zwart)}
dl.gwt dd{overflow-wrap:anywhere;min-width:0}
.sc-dekt,.sc-rood{margin-top:4px;overflow-wrap:anywhere}
.dw{display:inline-block;border-bottom:2px solid var(--accent);font-weight:600;color:var(--inkt);white-space:nowrap}
.tdd{background:var(--wit);border:1.5px solid var(--zwart);border-radius:var(--radius-s);padding:12px 14px;display:grid;gap:10px}
.tdd-kop h4{margin-bottom:2px}
ol.tdd-stappen{list-style:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 28px}
.tdd-stap{position:relative;border-top:5px solid var(--lijn);padding-top:8px;min-width:0}
.tdd-stap.rood.aan{border-color:var(--fout)}
.tdd-stap.rood.fout{border-color:var(--fout);border-top-style:dashed}
.tdd-stap.groen.aan{border-color:var(--zwart)}
.tdd-stap.rood::after{content:'→';position:absolute;right:-22px;top:4px;font-weight:800;color:var(--grijs)}
.tdd-l{display:block;font-family:'Archivo',sans-serif;font-weight:800;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--grijs)}

ipt is Python (scripts/release.py) in plaats van bash: zippen, uitsluiten en de pagina bijwerken gaan met de stdlib betrouwbaarder en zijn te testen.", "Versie, datum en grootte schrijft het script rechtstreeks in index.html (data-release-attributen), niet in een JSON-bestand, zodat ze ook zonder JavaScript zichtbaar zijn.", "De skillbron is ../skill-buildflow/skills/buildflow (instelbaar met BUILDFLOW_SKILL_SRC), op de stand inclusief de nog niet gepushte --redirect-from-commit. Uit [skill-repo] wordt verder niets gekopieerd.", "De voorbeeldrun draait in een aparte Claude Code-sessie in een wegwerpproject buiten de repo, zodat de gemeten kosten alleen van die demo zijn. Die bedragen blijven zoals bf.py ze berekent; zijn ze nul of klein, dan zegt de pagina dat eerlijk en staat er geen verzonnen bedrag.", "De viewer schrijft één live viewer.html; de momentopnames per stop zijn kopieën van dat bestand op het moment dat de run op goedkeuring wacht.", "Screenshots worden eenmalig met Playwright (MCP) gemaakt; er komt geen screenshotscript met een dependency in de repo. De README zegt hoe je ze opnieuw maakt.", "Het zichtbaar maken van de repo, Pages aanzetten, naar main mergen en gh release create gebeuren alleen in checkpoint 10, na expliciete bevestiging van Joep. Tot die tijd worden er geen pushes of releases gedaan.", "Bevindingen over fouten in de skill-docs die tijdens het bouwen opvallen, worden genoteerd (learnings of eindrapport) en niet in de skill zelf opgelost."], "out_of_scope": ["Een Engelse versie van de site", "Een eigen domein", "Analytics, cookies of een contactformulier", "Wijzigingen aan de skill zelf (SKILL.md, references, bf.py, viewer.html)", "[skill-repo] openbaar maken of er iets anders uit publiceren dan skills/buildflow in de zip", "Een donkere modus", "Een buildstap, site-generator of npm-dependencies"], "cost": {"computed_at": "2026-09-29T18:58:52Z", "sessions": ["sessie-1"], "transcript_files": 79, "totals": {"input": 3758, "cache_write_5m" "cmd": "gitleaks git --report-format json --report-path {report} --redact --no-banner --log-level error .", "kind": "secrets", "scope": "all", "format": "json", "blocking": true}, {"name": "python-compile", "cmd": "python3 -m compileall -q scripts tests", "kind": "lint", "scope": "all", "format": "text", "blocking": true}], "not_available": [{"name": "ruff/eslint/stylelint", "reason": "niet geinstalleerd; het project voegt geen dependencies toe"}], "reason": "gitleaks scant de volledige git-geschiedenis: dat is precies wat openbaar wordt. .buildflow/ is gitignored en telt niet mee. semgrep en gitleaks lokaal via Homebrew.", "configured_at": "2026-09-29T18:15:42Z", "file": ".buildflow/static.json", "baseline": {"at": "2026-09-29T18:16:17Z", "commit": "8c439e25b62bda4eaf465dd0bd8ee3682232acc2", "file": ".buildflow/buildflow-website/static-baseline.json", "checks_covered": ["semgrep|semgrep scan --config p/default --sarif --quiet --metrics off {files}", "gitleaks|gitleaks git --report-format json --report-path {report} --redact --no-banner --log-level error .", "python-compile|python3 -m compileall -q scripts tests"], "not_covered": [], "findings": 9, "tool_errors": []}}, "paused_from": "building", "learnings": "# Learnings: buildflow website\n\nEvery agent reads this before starting work. Newest last.\n- 2026-09-29 · Schrijf alle Nederlandse tekst (brief, design, sitecopy, rapporten) als lopende, niet te formele zinnen, zoals je het een collega uitlegt. Geen AI-taal: vermijd de woorden en patronen uit ~/.claude/CLAUDE.md, weinig opsommingen, geen stijve ambtelijke formuleringen.\n- 2026-09-29 · Geen native scrollbalken in panels: scrollende blokken krijgen een dunne scrollbalk in de huisstijl (zwart-lijn, geel bij hover).\n- 2026-09-29 · Een test moet falen als de implementatie kapot is. Zoeken naar tekst in de broncode telt niet als gedragstest; gedrag dat alleen in de browser te toetsen is, benoem je expliciet voor de UI-gate.\n", "next_action": "Gate gedrag van cp10 staat op bezig. Test eerst: de testschrijver zet de geplande scenario's om in tests en draait ze; leg de rode run vast met `bf.py gate cp10 behavior running --data '{\"red\":...}'`, daarna maakt de implementer ze groen en leg je `bf.py gate cp10 behavior passed|failed` vast.", "focus": "cp05", "brief_text": "# Website voor de buildflow-skill\n\n## Probleem\nbuildflow is nu een map met een README in een private repo. Als ik de skill aan iemand geef, moet die zelf uit SKILL.md en de references halen wat het ding doet, wat je eraan hebt en wat je bij elke stop moet doen. Dat lukt eigenlijk alleen als ik ernaast zit. Downloaden kan ook niet echt: de repo is private, en een zip rondsturen is na een week alweer oud.\n\n## Gebruikers en situaties\nHet gaat om collega's en mensen uit mijn netwerk die Claude Code al gebruiken. Ze krijgen de link van mij in een chat of mail en kijken er vaak eerst even op hun telefoon naar, later op hun laptop. Toegang tot mijn repos hebben ze niet. In een paar minuten willen ze snappen wat het is, of het iets voor hen is en hoe ze beginnen.\n\nDaarnaast ben ik zelf gebruiker: ik deel de link en zet een nieuwe versie online als de skill verandert.\n\n## Wat succes is\n- Wie de link krijgt, kan daarna zelf uitleggen wat buildflow doet en wanneer je het gebruikt.\n- De handleiding laat per fase zien wat je krijgt (brief, design, plan, rapporten, eindrapport) en wat je zelf doet (goedkeuren, feedback geven, testen), met de echte schermen erbij.\n- Iemand zonder toegang tot mijn repos kan de zip downloaden, uitpakken en `/buildflow` starten. Dat hebben we in een lege map getest.\n- De site hoort zichtbaar bij de viewer en de rapporten: geel en zwart, Archivo en Source Sans 3. Hij werkt op een smalle telefoon en op een breed scherm.\n- Een nieuwe versie uitbrengen kost me één script, geen handwerk.\n\n## Scope\n**In:** één Nederlandstalige pagina. Die legt uit wat het is, waar de waarde zit en hoe het werkt, met de fases, gates en stops. Daarna volgen een stap-voor-stap-handleiding, de installatie, de download en een stukje over beperkingen en veelgestelde vragen. Er komt een voorbeeldrun bij die je echt kunt openen (viewer, brief- en designstop, een checkpointrapport, het eindrapport), gemaakt met de skill zelf op een verzonnen demofeature. De download is een zip in een GitHub Release op `buildflow-website`, dat daarvoor openbaar wordt, met een MIT-licentie erin. Een releasescript maakt die zip uit `skills/buildflow`. De site draait op GitHub Pages. De README van de repo, design.md en het prototype horen er ook bij.\n\n**Uit:** een Engelse versie, een eigen domein, analytics, cookies of een contactformulier. De skill zelf pas ik niet aan; als de site een fout in de skill-docs blootlegt, noteer ik dat. [skill-repo] blijft private.\n\n**Kleinste versie die het waard is:** de pagina met uitleg, handleiding en installatie, plus de zip. De voorbeeldrun willen we echt graag, maar in het slechtste geval worden het screenshots.\n\n## Gekozen aanpak\nEen gewone statische pagina zonder buildstap: `index.html`, één CSS-bestand en een beetje JavaScript. Ik neem de kleuren, fonts en componenten over uit `viewer.html`, zoals de knoppen, chips, KPI-tegels, zwarte secties en de stepper. De voorbeeldrun komt als losse HTML-bestanden in `voorbeeld/`. Die maak ik met `bf.py`, dus ze zien er precies zo uit als wat een gebruiker straks zelf krijgt.\n\nEen site-generator als Astro of 11ty heb ik laten vallen: dat is een buildstap en een stapel dependencies voor één pagina. De pagina genereren vanuit het viewer-template in `bf.py` ook, want dan zit er ineens marketingtekst in de skill. En alleen screenshots vind ik te mager, omdat je dan niet kunt doorklikken. Previews als afbeelding komen wel op de pagina, met een link naar het echte bestand.\n\n## UI\nDe hele pagina is nieuw, dus er komt een designstap. De huisstijl van `skills/buildflow/assets/viewer.html` is de referentie. Het prototype laat de belangrijkste secties zien op mobiel en desktop, met de previews van de voorbeeldrun en de kopieerknop bij de installatiecommando's.\n\n## Randvoorwaarden en risico's\nDoordat de repo openbaar wordt, kan iedereen alles zien wat erin staat. In de voorbeeldrun en de zip mogen dus geen persoonlijke paden zoals `~/...` staan, en ook geen sessie-id's, e-mailadressen of echte projecten. De zip bevat alleen `skills/buildflow` en de LICENSE, niet mijn andere skills.\n\nDe repo openbaar zetten, Pages aanzetten en de release publiceren gebeurt pas helemaal aan het eind, en alleen als ik het bevestig.\n\nWat op de site staat, moet kloppen met SKILL.md, de references en `bf.py` zoals ze nu zijn. Dat geldt ook voor de `--redirect-from`-commit die nog niet gepusht is. De site moet eerlijk zijn over de grenzen. De skill werkt alleen in Claude Code en heeft `python3` nodig (alleen de standaardbibliotheek). De kosten in de rapporten zijn wat het via de API tegen lijstprijs gekost zou hebben, niet wat je echt betaalt.\n\nFonts komen van Google Fonts, net als in de viewer. Verder zijn er geen externe afhankelijkheden.\n\nDe teksten schrijven we in gewoon, lopend Nederlands: zoals je het een collega zou uitleggen, niet te formeel en zonder de typische AI-woorden en -constructies.\n\n## Open vragen\n- De skill heeft nog geen versienummer. Het releasescript begint bij v1.0.0, tenzij ik iets anders wil. Beslis ik bij de planstop.\n- Noemen we waar het idee vandaan komt (Shopify Helix, de AI Labs-video)? Voorstel: ja, kort en met links. Beslis ik bij de designstop.\n", "feature_context_text": "# Feature context: buildflow website\n\nA static, \"geel/zwart\" (yellow/black) marketing/documentation site for the `buildflow`\nClaude Code skill, in the visual style already used by the viewer and reports. Purpose:\nexplain what the skill does, how to use it, where the value is, a step-by-step guide\n(what you get vs. what you do), a download option, and install instructions.\n\n## 1. What buildflow is (source material for the site)\n\nSource files read: `skills/buildflow/SKILL.md`, `skills/buildflow/README.md` (Dutch,\nmost user-facing prose), all of `skills/buildflow/references/*.md`\n(brief.md, design.md, checkpoint-planner.md, test-planner.md, gate-behavior.md,\ngate-ui.md, gate-review.md, gate-docs.md, reporting.md, context-scout.md,\nstate-and-commands.md — read in full), `skills/buildflow/pricing.json`, and\n`skills/buildflow/scripts/bf.py` / `scripts/gate_hook.py` (skimmed for commands/behavior).\n\n**Value proposition.** buildflow turns a big feature request into small, ordered\ncheckpoints that each must pass hard quality gates (behavior tests, UI review against an\napproved prototype, adversarial code review, documentation) before the next one starts.\nOne orchestrator session never writes code itself — every build/test/review job goes to\na fresh-context subagent, which keeps quality high and the orchestrator's own context\nsmall. It is a from-scratch reimplementation of Shopify's Helix method\n(https://shopify.engineering/helix) and the AI Labs walkthrough of it\n(https://youtu.be/bBMp5tLxShQ), with buildflow adding on top: a brainstormed brief step,\na formal design stage with its own review, cost/time/quality reporting per checkpoint and\nper role, a shared/reused project-context profile across features, and idle-time /\ninterruption-aware time tracking. Differences from Helix/the video are listed explicitly\nat the end of `skills/buildflow/README.md` (\"Verschillen met de video en met Helix\") —\ngood raw material for a \"why this and not just Helix\" section.\n\n**The phases and the 4 human stops** (table in `SKILL.md`):\n| phase | what happens | stop? |\n|---|---|---|\n| 0 intake | read the repo: project context (reused) + feature context | no |\n| 1 brief | brainstorm with the user, write brief.md | **yes — approve the brief** |\n| 2 design | only if the feature changes what users see and no approved design exists | **yes — approve the design** |\n| 3 plan | checkpoints + test plan | **yes — approve the plan** |\n| 4 build | every checkpoint through gates (behavior, UI, review, docs) | no |\n| 4b docs | feature-wide documentation gate | no |\n| 5 review | user tries the feature | **yes — accept or give feedback** |\n\n`--auto` mode: the orchestrator self-approves brief/design/plan (`bf approve --note\nauto`) after showing them; gates stay equally strict; phase 5 always waits for the human.\n\n**The gates, per checkpoint** (`references/gate-*.md`):\n- **Gate 1, behavior**: tests written first (must fail for the right reason), then code\n  until green; earlier checkpoints' tests must stay green.\n- **Gate 2, UI** (only if the checkpoint is visible): two independent subagents\n  (`ui-visual`, `ui-behavior`) compare the running app to the approved prototype/design\n  reference — they see only the reference, the URL and the checkpoint's `ui_scope`, never\n  the project instructions. Differences get a severity and screen location; a mismatched\n  state is marked INVALID and re-run, not counted; blocker/high findings block the gate.\n- **Gate 3, adversarial review**: an `adversary` subagent assumes the code is wrong and\n  tries to prove it; a `fixer` resolves findings or argues one is wrong with evidence;\n  loop with a fresh adversary each round (never the same one approving its own fix), max\n  4 rounds before pausing to ask the human.\n- **Gate 4, docs** (only if the checkpoint changes something documented): a `docs`\n  subagent updates existing project documentation in place; a `docs-review` subagent\n  checks every changed statement against the code; loop until approved.\n- After the last checkpoint: a mandatory **feature docs gate** covering the feature as a\n  whole (overview, changelog, cross-links, design.md/prototype kept true to what was\n  built, ADR if relevant) before the review stop.\n\n**What the user gets at each stage:**\n- Phase 0/1: `.buildflow/context.md` (project profile, reused across features) and\n  `.buildflow/<slug>/context-feature.md`; then `brief.md` + a 5-line chat summary +\n  the viewer opened.\n- Phase 2 (if run): `design.md` (in the project's own docs location/format), prototype\n  pages built on the project's real front-end stack (Storybook or static pages with the\n  app's real CSS), a component map, shown embedded in the viewer for approval.\n- Phase 3: `plan.json` → 4–12 ordered checkpoints, `tests.json`, shown in the viewer plus\n  a chat summary; feedback can be typed in the viewer (\"Copy feedback\" button) or in chat.\n- Phase 4: after every checkpoint, a chat report and a written report\n  (`.buildflow/<slug>/reports/cpNN.md` + `.html`) with per-gate result, attempt count,\n  tests, findings (fixed / accepted / wontfix), duration and cost.\n- Phase 5: a final report (`.buildflow/<slug>/reports/final.html`) summarizing the whole\n  feature, plus the always-current live viewer (`.buildflow/<slug>/viewer.html`).\n- Throughout: a self-contained, single-file HTML viewer per feature\n  (`.buildflow/<slug>/viewer.html`) showing plan, per-gate progress, costs and learnings;\n  works on phone/tablet/desktop, is printable to PDF, and can be forwarded as a single\n  file with no other assets needed. `bf.py serve --open` serves a self-refreshing version\n  during a live build.\n\n**What the user has to do at each stop:** approve the brief (round-trip conversation\nfirst — problem, users, success criteria, scope in/out, 2–3 approaches with a\nrecommendation, risks); approve the design (reviewed in the viewer, embedded prototype);\napprove the plan (or leave inline feedback per checkpoint in the viewer); at the end, try\nthe feature themselves and either accept (`bf accept`) or give feedback (turned into new\ncheckpoints run through the same gates, plus permanent entries in `learnings.md`).\n\n**Enforcement mechanisms:**\n- `bf.py` (the CLI, invoked as `python3 ${CLAUDE_SKILL_DIR}/scripts/bf.py <command>`)\n  refuses illegal state transitions: planning/building before the brief or design is\n  approved, a prototype under the git-ignored `.buildflow/` path, closing a checkpoint\n  with an open docs gate, starting review before feature docs pass, passing a gate while\n  an earlier one is still open, passing behavior with failing tests, passing UI or review\n  with an open blocker/high finding, starting checkpoint N+1 before N passed.\n- A **Stop hook** (`skills/buildflow/scripts/gate_hook.py`, registered in `SKILL.md`\n  frontmatter under `hooks.Stop` and `hooks.StopFailure`) blocks the orchestrator from\n  ending its turn while the run is in phase `building`/`documenting` with open gates. It\n  is a no-op if there is no active run. It has a \"progress guard\": if state hasn't moved\n  across `MAX_BLOCKS_WITHOUT_PROGRESS = 4` consecutive blocks, it gives up and tells the\n  orchestrator to run `bf.py status` or `bf.py pause`. Background subagents running is not\n  treated as \"no progress\" — the turn is allowed to end while waiting on them.\n- `StopFailure` fires when the turn ends on an API error (rate limit, overload); the hook\n  logs an interruption via `bf.record_interruption` and marks in-flight gate attempts as\n  interrupted, so nothing is reported as passed without having actually been seen.\n\n**Cost and time measurement:** costs come from Claude Code's own transcripts\n(`~/.claude/projects/...`), including subagents; `bf.py` sums input/cache/output tokens\nper API call, prices them via `skills/buildflow/pricing.json` (USD per million tokens,\nAnthropic first-party list prices; cache write 5m = 1.25x input, 1h = 2x input), and\nbreaks the total down by role (planner, implementer, adversary, ...), by checkpoint, and\nby model. This covers the whole feature: every session tied to the run from `init` to\n`accept`, including feedback rounds — the README explicitly warns to ask unrelated\nquestions in a different session so they don't get counted. The dollar figure is an\n\"API-equivalent at list price\" for comparing runs, not an actual subscription bill. Time\nis derived from transcript activity: silence longer than `BUILDFLOW_IDLE_GAP_MIN` (10\nmin) counts as idle/interrupted, not build time; time in the waiting-for-human phases\ncounts separately as \"waiting on you\"; the rest is active build time.\n\n**Interruption handling:** rate limits/API errors end the turn without the normal Stop\nhook; `StopFailure` records the interruption and marks any running gate attempt\n`interrupted` so it is redone with a fresh subagent rather than trusting a result nobody\nsaw. Crashes/closed laptops leave no trace — `bf status` on resume, plus\n`bf interrupted cpNN <gate> --reason \"...\"` if the orchestrator itself notices a stale\n`running` gate.\n\n**Requirements** (from `skills/buildflow/README.md` \"Installeren\"): Python 3.9+ (standard\nlibrary only, no extra pip installs), git, and for the UI gate a browser tool available\nto Claude Code (Playwright MCP or Claude in Chrome). `python3\n~/.claude/skills/buildflow/scripts/bf.py doctor` checks the setup (see `cmd_doctor` in\n`bf.py`, line ~1503).\n\n**Install steps as documented** (`skills/buildflow/README.md`, section \"Installeren\"):\n```bash\ngit clone [e-mailadres]:joepvanabeelen/[skill-repo].git ~/[skill-repo]\nln -s ~/[skill-repo]/skills/buildflow ~/.claude/skills/buildflow\n```\n— for a single machine where `~/.claude/skills` is a plain directory. Alternative: use\nthe whole `[skill-repo]` repo as the skills directory, per the root `README.md`:\n```bash\ngit clone [e-mailadres]:joepvanabeelen/[skill-repo].git ~/[skill-repo]\n[ -e ~/.claude/skills ] && mv ~/.claude/skills ~/.claude/skills.bak\nln -s ~/[skill-repo]/skills ~/.claude/skills\n```\nFor a team/project install, the skill folder can instead live at\n`.claude/skills/buildflow/` inside the target project — the Stop hook command in\n`SKILL.md` looks in **both** places, in this order:\n1. `$HOME/.claude/skills/buildflow/scripts/gate_hook.py` (user-level symlink/clone)\n2. `$CLAUDE_PROJECT_DIR/.claude/skills/buildflow/scripts/gate_hook.py` (project-local copy)\n\nIf neither file exists the hook command exits 0 silently (see the `hooks.Stop`/\n`hooks.StopFailure` command line in `skills/buildflow/SKILL.md`). This means the install\nlocation is not cosmetic: the hook literally will not fire, and the run will not be\nenforced, unless `gate_hook.py` sits at one of those two exact paths.\n\n**How to share** (`skills/buildflow/README.md`, section \"Delen\"):\n- The skill itself: give read access to the repo, or copy the `skills/buildflow` folder\n  (nothing personal/secret in it).\n- A plan or report: send `viewer.html` or `reports/final.html` directly (both are fully\n  self-contained), or ask Claude to publish the final report as a private Artifact after\n  the fact for a shareable link.\n- Run data is git-ignored by default (`.buildflow/.gitignore`); committing reports means\n  deleting that ignore file.\n\n## 2. Touch points — files the site will be built from / must stay consistent with\n\n- `skills/buildflow/README.md` — primary Dutch source of truth for the pitch, workflow,\n  reporting, viewer description, install (\"Installeren\") and share (\"Delen\") sections,\n  and the \"Verschillen met de video en met Helix\" comparison. Any install/host-location\n  change on the website must mirror this file (and vice versa).\n- `skills/buildflow/SKILL.md` — the phase table, gate list, enforcement mechanisms; more\n  technical/orchestrator-facing but useful for an accurate \"how it works\" deep section.\n- Root `README.md` — lists all skills in a table, including one row for `buildflow` with\n  a one-line description and a link to `skills/buildflow/README.md`. If the website adds\n  a public/hosted description that diverges from this row, this table should be checked\n  for drift (not necessarily edited, since this repo is private — see §4).\n- `skills/buildflow/pricing.json` — source for any \"how cost is computed\" claim on the\n  site (model prices, cache multipliers) — do not hardcode figures that could go stale\n  without noting the source file.\n- `skills/buildflow/assets/viewer.html` — the design system to copy/reuse (see §3).\n- No dedicated \"docs site\", \"marketing\", or \"website\" directory exists in the repo yet;\n  the website is a wholly new artifact with no existing home to slot into (open question\n  for the brief: where does its source live — see §8).\n\n## 3. Closest existing design examples\n\n**Primary visual reference:** `skills/buildflow/assets/viewer.html` (662 lines,\nself-contained HTML/CSS/JS template used to render both the live viewer and the\ncheckpoint/final reports). Key design tokens and components, read directly from the file:\n- Color tokens (`:root`): `--accent:#FFCE1F` (yellow), `--accent-zacht:#FFF1B8`,\n  `--accent-licht:#FFFAE6`, `--accent-diep:#8A6A00`, `--zwart:#141412` (near-black),\n  `--inkt:#26251F`, `--grijs:#686559`, `--grijs-licht:#9C998D`, `--lijn:#E7E4DB`,\n  `--vlak:#F7F6F2`, `--wit:#FFFFFF`, `--fout:#B42318` (error red), radius `14px`/`8px`,\n  max content width `1200px`.\n- Fonts: Google Fonts `Archivo` (headings, variable weight/width, condensed feel via\n  `font-stretch`) and `Source Sans 3` (body), loaded via `@import`/`<link>` from\n  `fonts.googleapis.com`.\n- Components visible in the CSS: sticky blurred header with a wordmark that underlines\n  itself in yellow (`.woordmerk b::after`), a black top bar (`.topbalk`), pill badges\n  (`.pil.geel` / `.zwart` / `.rand`), yellow rounded buttons with hover lift (`.knop`),\n  a bordered \"volgende stap\" callout card with a yellow drop-shadow\n  (`.volgende{box-shadow:6px 6px 0 var(--accent)}`), light/dark alternating page sections\n  (`.sectie.vlak`, `.sectie.zwart`), and responsive tables that collapse to cards below\n  820px with no horizontal scroll from 320–1600px (per commit `c1ffaa9`). This is the\n  visual language the new website should match — same palette, same type pairing, same\n  \"yellow accent bar under black wordmark\" motif, same card/pill/button shapes.\n- No separate design.md or design system doc exists for buildflow itself; the viewer\n  template file is the only \"spec\" — style must be reverse-engineered from its CSS.\n\n**Rendered demo outputs** found under the scratchpad (from prior *demo* buildflow runs,\nnot part of the repo, but usable as real screenshots or embed-ready HTML showing the\nsystem in actual use):\n- `.../scratchpad/demo/.buildflow/verlofaanvragen/viewer.html` — full viewer for a\n  3-checkpoint \"leave request\" (verlofaanvragen) feature: plan, progress, likely richest\n  example of the finished viewer in a normal (all-passed) run.\n- `.../scratchpad/demo/.buildflow/verlofaanvragen/reports/{cp01,cp02,cp03,final}.html` —\n  one report per checkpoint plus the final report for that same run: good source for\n  screenshots of \"what a checkpoint report looks like\" and \"what the final report looks\n  like\".\n- `.../scratchpad/demo2/.buildflow/verlofaanvragen/...` — a second run of the same\n  feature (viewer + cp01–cp03 + final reports), likely a near-duplicate/variant; only\n  needed as a fallback if demo/ assets are incomplete.\n- `.../scratchpad/demo3/.buildflow/rate-limit-test/{viewer.html, reports/cp01.html,\n  reports/final.html}` — a run that specifically exercises the interruption/rate-limit\n  path; useful if the site wants to show the interruption-handling story with a real\n  example (fewer checkpoints, likely shows an \"interrupted\" state somewhere).\n- `.../scratchpad/demo4/.buildflow/verlof-goedkeuren/` — contains `viewer.html`,\n  `v-brief.html`, `v-design.html`, and `prototype/index.html`: this is the richest set for\n  showing the **early** stops (brief view and design view, not just build progress), plus\n  an actual prototype page example. Good source for \"what the brief/design stop looks\n  like\" screenshots.\n- `.../scratchpad/demo5/.buildflow/verlof-goedkeuren/` — another \"verlof-goedkeuren\" run\n  with `prototype/index.html`, `reports/{cp01,cp02,final}.html`, `viewer.html`, and also\n  `docs/design/prototypes/verlof/index.html` (a prototype committed into a project's own\n  docs tree, illustrating the \"prototype lives in the project's real docs location, not\n  thrown away\" claim from `references/design.md`/README).\nThese are temporary scratchpad files (session-scoped, not in the repo), so if the website\nbuild wants to embed live iframes or static screenshots of them, those assets must be\ncopied/re-generated into the actual project (e.g. as static images checked into a\n`docs/` or `site/` folder) rather than referenced by their `~/tmp/...` path.\n\n## 4. Download / distribution facts\n\n- The source repo `joepvanabeelen/[skill-repo]` is **private**\n  (`gh repo view` → `\"visibility\":\"PRIVATE\"`). A public GitHub Pages site cannot be hosted\n  directly from this private repo without a paid GitHub plan (GitHub Pages requires the\n  repo to be public on free plans).\n- **No releases exist**: `gh release list -R joepvanabeelen/[skill-repo]` returned empty.\n  There is currently no versioned/packaged artifact to link to as a \"download\".\n- A \"download\" today would have to mean either: (a) a `git clone` of the whole\n  `[skill-repo]` repo (requires the visitor to already have access, since it's private),\n  or (b) a zip of just `skills/buildflow/` generated ad hoc (e.g. `zip -r buildflow.zip\n  skills/buildflow`) and hosted somewhere the audience can reach it, or (c) a GitHub\n  Release with a zip asset (would need `gh release create`, and would still sit behind\n  the repo's private visibility unless the release is exposed some other way). None of\n  these currently exist; the brief needs to decide which one the site offers, and\n  whether the *site itself* is served from a place separate from the private repo (see\n  open questions, §8).\n- **Install location precision** (important for correctness of any install\n  instructions on the site): the Stop/StopFailure hook command embedded in\n  `skills/buildflow/SKILL.md` frontmatter is literally:\n  ```\n  f=\"$HOME/.claude/skills/buildflow/scripts/gate_hook.py\"; [ -f \"$f\" ] || f=\"$CLAUDE_PROJECT_DIR/.claude/skills/buildflow/scripts/gate_hook.py\"; [ -f \"$f\" ] || exit 0; exec python3 \"$f\"\n  ```\n  So the **only two valid install locations** for the hook to actually fire are:\n  1. `~/.claude/skills/buildflow/scripts/gate_hook.py` (checked first — user-global\n     install, e.g. via the symlink from `~/[skill-repo]`)\n  2. `<project root>/.claude/skills/buildflow/scripts/gate_hook.py` (checked second, using\n     `$CLAUDE_PROJECT_DIR` — a project-local install)\n  Any other location (e.g. an arbitrary path, or just having `SKILL.md` present without\n  the matching `scripts/` folder alongside it at one of these two paths) means the hook\n  silently no-ops and gate enforcement is not active, even though `/buildflow` itself may\n  still appear to work partially. The website's install instructions must preserve this\n  exactly — copying only `SKILL.md` without `scripts/` and `references/` next to it in\n  one of these two locations will silently break enforcement.\n\n## 5. Tests in this area\n\nNo automated tests exist for `skills/buildflow` today (it is a prompt/state-machine\nskill, not application code with a test suite) and none exist for a website since it\ndoesn't exist yet. For a static site, what could reasonably be checked automatically:\n- HTML validity (e.g. `html-validate` or W3C validator) on the built page(s).\n- Broken/dead link check (internal anchors, any links to the repo, to the Shopify/AI Labs\n  sources, to a download asset).\n- Responsive overflow check at common breakpoints (the buildflow viewer itself already\n  had a specific fix for this — commit `c1ffaa9` \"tabellen tot 820px als kaarten, geen\n  horizontale scroll op 320-1600px\" — so the site should be checked the same way, e.g.\n  with a headless-browser screenshot pass at 320/768/1200/1600px widths).\n- If any code snippets (install commands) are shown, a lint/copy-paste check that they\n  match the actual current commands in `SKILL.md`/`README.md` would catch drift.\n\n## 6. Docs that must stay consistent with the website\n\n- `skills/buildflow/README.md` — \"Installeren\" and \"Delen\" sections: any install command\n  or sharing method shown on the website must match this file (or this file should be\n  updated alongside the site if the recommended install path changes).\n- `skills/buildflow/SKILL.md` — hook path logic (`$HOME/...` / `$CLAUDE_PROJECT_DIR/...`)\n  — the website's install instructions are only correct if they preserve this exact\n  two-location lookup.\n- Root `README.md` skills table — the one-line description of `buildflow` there should\n  stay in the same spirit as whatever positioning the website uses, even though this repo\n  itself is private and the table is not \"the public face.\"\n- `skills/buildflow/pricing.json` — if the website explains or shows example costs, it\n  should note this file as the source and flag that it needs updating when Anthropic\n  pricing changes (the file's own `_comment` field already says this).\n\n## 7. Recent changes (`git log --oneline -10`)\n\n```\nb8f7de0 buildflow: documentatie als gates, design als projectdocumentatie op de bestaande stack\n64fd58c buildflow: projectcontext, brief en design als formele fases\nc1ffaa9 buildflow viewer: tabellen tot 820px als kaarten, geen horizontale scroll op 320-1600px\n8a4f84f buildflow: tijd meten op activiteit en onderbrekingen vastleggen\nc8c57c5 buildflow: checkpoints en gates voor grote features, naar Shopify's Helix\n25b7953 [commit aan een andere skill]\neeb1588 [commit aan een andere skill]\n3f66c90 Skills onder versiebeheer voor sync tussen apparaten\n```\nAll buildflow-specific history is recent and incremental (viewer responsiveness, cost/\ntime measurement, checkpoints/gates, then formalizing brief/design/docs-as-gates) —\nno prior website or docs-site work exists to build on. Current branch:\n`buildflow/buildflow-website` (clean working tree, branched from `main`).\n\n## 8. Open questions for the brief\n\nThings the code cannot answer — the user needs to decide:\n\n- **Audience**: is this site for colleagues/prospective users inside the user's own\n  company, or meant to be genuinely public (e.g. linked from a blog post, shared with\n  other Claude Code users outside the org)? This changes tone, whether repo/company\n  details can appear, and whether a \"download\" needs to work for strangers or only for\n  people who already have repo access.\n- **Language**: NL, EN, or both? All current user-facing prose (`README.md`) is Dutch;\n  `SKILL.md` (orchestrator-facing) is English. A public/external audience likely wants\n  English; an internal Dutch-speaking audience is fine with Dutch as-is.\n- **Hosting**: GitHub Pages needs a public repo (or a paid plan) — the source repo is\n  private. Options to resolve this: (a) make a new, separate public repo just for the\n  site (and mirror or link back to the private skill repo), (b) publish the site as a\n  Claude.ai Artifact (private by default, shareable via link, no separate hosting\n  needed, no custom domain), (c) ship it as a single self-contained `.html` file (matching\n  the viewer's own \"one file, forward it\" philosophy) that anyone can open locally or the\n  user can drop anywhere, (d) keep the private repo as source and use a different static\n  host (e.g. Netlify/Vercel) that can pull from a private repo. This decision drives the\n  whole implementation approach and should be settled before the design/plan phase.\n- **What \"download\" delivers**: a zip of `skills/buildflow/` generated on the fly or\n  pre-built and attached somewhere; a `git clone` command (only usable by people with repo\n  access, since it's private); or a proper GitHub Release with a zip asset (none exist\n  today — would need to be created). Also whether \"download\" should include just the\n  skill, or the skill plus a worked example (one of the scratchpad demo runs).\n- **Screenshots / live demo**: should the site embed real screenshots or live iframes of\n  the viewer/reports (using the scratchpad demo assets in §3, copied into the actual\n  project) to show, not just tell, what the output looks like? This is likely a strong\n  answer to \"modern, mooi en duidelijk\" but needs the demo HTML files copied out of the\n  ephemeral scratchpad into something the site's source can actually reference.\n- **Single page vs. multi-page**: one long scrolling page (hero → what it does → how it\n  works/phases → gates → cost & viewer → install → download) versus separate pages (e.g.\n  a dedicated \"install\" page, a dedicated \"how it works\" deep-dive). The viewer itself is\n  a single self-contained HTML file, which might argue for the same approach on the\n  marketing site for consistency and portability.\n- **Domain / name**: is this hosted under any existing domain the user owns, or purely on\n  claude.ai/Pages/Netlify's default subdomain? No existing domain or hosting account is\n  visible in this repo.\n- **Source location**: should the website's source code live inside this same\n  `[skill-repo]` repo (e.g. under a new `docs/` or `site/` folder, or on a dedicated\n  branch as currently set up — `buildflow/buildflow-website`), or in a brand-new separate\n  (possibly public) repo? Given the private-repo/GitHub-Pages conflict above, this is\n  tightly coupled to the hosting decision.\n", "project_context_text": "# Project context: skill-buildflow\n\n## 1. What this is\n\nThis repo (`joepvanabeelen/[skill-repo]`, private on GitHub) is a personal collection of\nClaude Code skills, synced between machines via git and symlinked into `~/.claude/skills/`.\nIt has no application and no build system: each skill is a folder of Markdown\ninstructions, and `buildflow` additionally has a Python CLI and one HTML template.\n`buildflow` runs large features through ordered checkpoints with hard quality gates\n(behavior tests, UI review, adversarial code review, docs), reports progress in a\ngenerated HTML viewer, and tracks cost/time from Claude Code's own transcripts. The\nfeature on this branch (`buildflow/buildflow-website`) is a static website for the\n`buildflow` skill, in the visual style of its own viewer/report template.\n\nMain user types: the **skill author/maintainer** (Joep, edits `SKILL.md` files directly,\nper root `README.md`: \"Wijzig een skill direct in `~/[skill-repo]/skills/<naam>/SKILL.md`\nen commit\"); a **Claude Code orchestrator session** running buildflow (reads\n`skills/buildflow/SKILL.md` + `references/*.md`, drives `scripts/bf.py`); a **human\nreviewer** inside a run (approves brief/design/plan, reviews the final feature via the\ngenerated viewer/report HTML); and, for this feature, a **website visitor** deciding\nwhether to install buildflow.\n\nDomain glossary (term — meaning — defined in):\n- **skill** — a Claude Code capability package with `SKILL.md` frontmatter — `skills/*/`.\n- **checkpoint (`cpNN`)** — one ordered, gated slice of a build — `skills/buildflow/SKILL.md` (\"Phase 4: build\").\n- **gate** — a pass/fail check per checkpoint: `behavior`, `ui`, `review`, `docs` — `skills/buildflow/scripts/bf.py` (`CP_GATES`).\n- **brief** — the agreed scope contract, stop 1 — `skills/buildflow/references/brief.md`.\n- **design.md / prototype** — the feature's design documentation and mock, stop 2 — `skills/buildflow/references/design.md`.\n- **plan** — ordered checkpoints + `tests.json`, stop 3 — `skills/buildflow/references/checkpoint-planner.md`.\n- **learnings** — rules from human feedback every subagent reads first — `.buildflow/<slug>/learnings.md`.\n- **orchestrator** — the main session; never writes code itself — `skills/buildflow/SKILL.md` (top).\n- **subagent tag** (`bf:<scope>:<role>`) — naming for delegated Agent calls, used for cost attribution — `skills/buildflow/SKILL.md` (\"Subagent naming is not optional\").\n- **viewer** — the self-contained HTML state page — `skills/buildflow/assets/viewer.html`.\n- **bf.py** — single stdlib script for state, gates, cost, reports, viewer — `skills/buildflow/scripts/bf.py`.\n- **gate_hook.py** — Stop/StopFailure hook blocking early turn-end and recording interruptions — `skills/buildflow/scripts/gate_hook.py`.\n- **Helix** — the Shopify methodology buildflow is modeled on — `skills/buildflow/README.md`.\n- **slug** — run id / folder name under `.buildflow/<slug>/` — `skills/buildflow/scripts/bf.py`.\n\n## 2. Stack and layout\n\n- **Language**: Python 3 stdlib only for `bf.py` and `gate_hook.py`\n  (`skills/buildflow/README.md`: \"Python 3.9+ (alleen de standaardbibliotheek)\").\n- **Front end**: one self-contained HTML file, `skills/buildflow/assets/viewer.html`\n  (inline CSS/JS, no build tool, no framework).\n- Everything else is Markdown (`SKILL.md`, `references/*.md`, READMEs) — prompts, not\n  narrative documentation.\n- **Package manager**: none. No `package.json`, `requirements.txt`, `pyproject.toml`, or\n  lockfile anywhere in the repo.\n- **Layout**:\n  - `README.md` — root README (Dutch): sync/install instructions, skills table.\n  - `skills/` — one folder per skill: `buildflow/` and four other skills.\n  - `skills/buildflow/SKILL.md` — orchestrator instructions; frontmatter has `name`,\n    `description`, `argument-hint`, `disable-model-invocation: true`, `allowed-tools`,\n    and `hooks` (`Stop`, `StopFailure`) wired to `scripts/gate_hook.py`.\n  - `skills/buildflow/README.md` — Dutch user-facing doc (flow, reporting, viewer, install, sharing).\n  - `skills/buildflow/references/` — 11 phase/gate/role prompt files (see §9).\n  - `skills/buildflow/scripts/bf.py` (1674 lines) — state, CLI, gates, cost/time, report+viewer generation.\n  - `skills/buildflow/scripts/gate_hook.py` (84 lines) — the Stop-hook.\n  - `skills/buildflow/assets/viewer.html` (663 lines) — viewer/report template.\n  - `skills/buildflow/pricing.json` — USD-per-million-token prices for cost reports.\n  - `.buildflow/` — gitignored scratch for in-progress runs (see §11); this context file\n    is the intended exception.\n  - `.playwright-mcp/` — gitignored browser-tool scratch data.\n- **Entry point**: no running app. Invoke the skill in Claude Code with\n  `/buildflow <feature description>` (frontmatter `argument-hint`), which runs\n  `python3 ${CLAUDE_SKILL_DIR}/scripts/bf.py <command>` for every state change.\n\n## 3. How to run it\n\nNo dev server, seed data, or test accounts — this repo ships a skill and (on this branch)\na static website to author as plain files.\n\n- **Install** (root `README.md`):\n  ```bash\n  git clone [e-mailadres]:joepvanabeelen/[skill-repo].git ~/[skill-repo]\n  ln -s ~/[skill-repo]/skills ~/.claude/skills\n  ```\n  On this machine the symlink is actually per-skill:\n  `~/.claude/skills/buildflow -> ~/projects/joep/skill-buildflow/skills/buildflow`\n  (confirmed with `ls -la ~/.claude/skills`). Both patterns work.\n- **CLI** (prints/writes files, no server):\n  ```bash\n  python3 skills/buildflow/scripts/bf.py doctor      # checks the setup\n  python3 skills/buildflow/scripts/bf.py status\n  python3 skills/buildflow/scripts/bf.py serve --open # self-refreshing local viewer\n  ```\n  No fixed port is documented for `serve`; check `bf.py`'s `http.server`/`socketserver`\n  usage if needed.\n- **For the website**: static HTML/CSS(+vanilla JS per §7) — \"running\" it means opening\n  the file directly or serving it with any static server (e.g. `python3 -m http.server`)\n  from whatever location is chosen (see §9). No dev URL/port established yet — none found.\n- **Environment variables** (names only): `BUILDFLOW_ROOT` (override project-root\n  detection), `BUILDFLOW_IDLE_GAP_MIN` (idle threshold, default 10 min — `SKILL.md`,\n  \"Interruptions and resuming\"). Neither is a secret.\n- **Test accounts / seed data**: none found — no application, no database.\n\n## 4. Tests\n\nNo test framework exists in this repo: no `tests/` directory, no `pytest`/`unittest`\nconfig, no JS test runner, no `test_*.py` files. `bf.py` has no accompanying unit tests.\nCurrent state: 0 tests exist, 0 fail. (\"Tests\" that buildflow gates check are always the\n*target* project's own suite, recorded per run — not a fact about this repo.) If this\nwebsite adds interactive JS, there's no existing pattern here to extend.\n\n## 5. Conventions\n\nNo `CONTRIBUTING`, `.eslintrc`, `.prettierrc`, or lint/format config exists anywhere in\nthe repo. No project-level `CLAUDE.md`/`AGENTS.md` inside `skill-buildflow` itself.\n\nPatterns the code actually follows:\n- **User-facing prose is Dutch** (`README.md`, `skills/buildflow/README.md`, most\n  `SKILL.md` files). `skills/buildflow/SKILL.md` itself is English but supports\n  `--lang nl|en`, controlling the language shown to the human and generated in\n  `viewer.html` (`T = {en:{...}, nl:{...}}`).\n- **CSS tokens/classes are named in Dutch** throughout `viewer.html`: `--zwart`,\n  `--inkt`, `--grijs`, `--lijn`, `--vlak`, `--wit`; classes `.knop`, `.pil`, `.sectie`,\n  `.kop`, `.woordmerk`, `.poging`. A website in this house style should keep this\n  vocabulary rather than translate it, since it must match `viewer.html` structurally.\n- **Single-file, stdlib/vanilla-only tooling** — `bf.py` has no external dependencies;\n  `viewer.html` has no bundler. Follow \"no build step, no framework\" unless the brief says otherwise.\n- **Docs are part of done.** `SKILL.md` (\"Rules\"): \"Change existing documentation rather\n  than adding parallel files, never write a claim you did not verify in the code, and\n  keep design.md and the prototype true to what was built.\"\n- **Design follows the existing stack.** `references/design.md`: \"A design that the stack\n  cannot build without a new library or a pile of one-off CSS is a wrong design, however\n  good it looks.\" Here, the stack to follow is `viewer.html`'s own CSS (§7).\n- **Never put project documentation under `.buildflow/`.** `references/design.md`: \"that\n  folder is scratch space and is not committed.\" The website must live in a committed\n  location (§9), not `.buildflow/`.\n- **Tests are the spec.** `SKILL.md`: \"Never weaken, skip or delete a test to get a gate green.\"\n- **Every finding is recorded, nothing disappears quietly** — relevant if this website\n  goes through buildflow's own adversarial review gate.\n\n**User's global writing-style rules** (`~/.claude/CLAUDE.md`, \"Schrijfstijl\") apply to all\nnon-code text in this repo, Dutch or English. Tone: professional-informal,\nanalytical/advisory, like a knowledgeable colleague — not distant, not marketing-speak,\nnot overly casual. Structure: don't default to intro → 3–5 bulleted sections → summary;\nlet structure follow content; vary sentence/paragraph length.\n- Avoid (NL): bovendien, daarnaast, tevens, voorts, echter as opener, \"niet alleen...\n  maar ook\", \"het is belangrijk om op te merken dat\", cruciaal/essentieel, samenvattend,\n  kortom, al met al, in de kern, op het gebied van, een breed scala aan, \"spelen een\n  cruciale/belangrijke rol\", naadloos, robuust, holistisch, faciliteren, optimaliseren\n  (unless literally technical), \"inzetten op\" as filler, koers zetten naar, \"een reis\" as\n  process metaphor.\n- Avoid (EN): delve, tapestry, testament (to), pivotal, crucial, robust, seamless,\n  leverage (verb), utilize, \"landscape\", multifaceted, holistic, \"in today's fast-paced\n  world\", \"it's important to note\", moreover, furthermore, additionally (as opener), \"not\n  only... but also\", \"in conclusion/summary/overall\", boasts/serves as, navigate\n  (metaphor), unlock (potential), game-changer, cutting-edge, transformative, revolutionize.\n- Avoid structurally: overused em dashes as connectors; forced rule-of-three; repeated\n  parallel negation (\"not X, but Y\"); bold keywords as artificial emphasis in running\n  text; Title Case subheadings; rhetorical Q&A; vague/weasel attribution without a\n  source; \"elegant variation\" — repetition of a correct term is fine.\n- What reads human: concrete specifics over general claims; nuanced/mixed assessments;\n  direct active sentences; one main point per paragraph; plain concrete verbs. Reread\n  longer text against these lists before delivering.\n\n## 6. Architecture\n\nA skill folder may contain (`skills/buildflow/README.md` \"Bestanden\"): `SKILL.md`\n(required, YAML frontmatter + instructions), `references/` (phase/role prompts loaded on\ndemand — keeps orchestrator context small, per `SKILL.md`), `scripts/` (executable\nhelpers), `assets/` (static files, e.g. `viewer.html`).\n\nSkills install by symlinking the whole `skills/` dir or a single skill folder into\n`~/.claude/skills/` (confirmed live: `~/.claude/skills/buildflow -> .../skills/buildflow`).\nClaude Code reads `~/.claude/skills/` at session start, so `git pull` on the source repo\npropagates to every machine with no separate install step.\n\nHow `buildflow` works internally:\n- **Orchestration**: one Claude Code session never writes feature code itself; it calls\n  `bf.py` for every state change and delegates all work to fresh-context subagents tagged\n  `bf:<scope>:<role>`.\n- **Phases** (`PHASES` in `bf.py`, mirrored in `SKILL.md`): `intake` → `brief` →\n  (`design`, only if needed) → `planning` → `building` → `documenting` →\n  `awaiting_human_review` → `done`, plus `paused`. `WAIT_PHASES` marks the four human\n  stops: brief, design, plan, final review.\n- **Gates** (`CP_GATES = [\"behavior\",\"ui\",\"review\",\"docs\"]`): 1) behavior (tests-first,\n  red-then-green), 2) UI (only if visible — two blind reviewers vs. the approved\n  prototype), 3) adversarial review (reviewer → fixer → fresh reviewer, max 4 rounds), 4)\n  docs (writer → reviewer loop). A gate passes only with recorded evidence.\n- **`bf.py`** owns run state (`state.json`/`data.json` under `.buildflow/<slug>/`),\n  refuses illegal transitions, computes cost/time from Claude Code's own transcripts\n  (`~/.claude/projects/...`) priced via `pricing.json`, and renders the viewer/reports by\n  injecting JSON into `assets/viewer.html` (`window.BF = /*__BF_DATA__*/null;`).\n- **`gate_hook.py`**, registered via `SKILL.md`'s `hooks.Stop`/`hooks.StopFailure`, blocks\n  ending the turn during `building`/`documenting` with open gates, and on failure marks\n  any `running` attempt as `interrupted` so a resumed session never fabricates a result.\n- **The viewer** is generated per run at `.buildflow/<slug>/viewer.html` and per\n  checkpoint/final report at `.buildflow/<slug>/reports/*.html`, all from the same\n  template with different embedded JSON and a `focus` field toggling report vs. full view.\n\n## 7. Front-end stack (house style to match)\n\nThe only front-end artifact is `skills/buildflow/assets/viewer.html`: one self-contained\nHTML file, inline CSS/JS, no build step — this is the design system the website must match.\n\n**Fonts** (Google Fonts):\n`https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap`\n— Archivo (variable width/weight, via `font-stretch`) for headings/wordmark/eyebrows/pills/KPIs/table headers; Source Sans 3 for body.\n\n**CSS custom properties** (`:root`, lines 10–15):\n```\n--accent:#FFCE1F  --accent-zacht:#FFF1B8  --accent-licht:#FFFAE6  --accent-diep:#8A6A00\n--zwart:#141412   --inkt:#26251F          --grijs:#686559        --grijs-licht:#9C998D\n--lijn:#E7E4DB    --vlak:#F7F6F2          --wit:#FFFFFF          --fout:#B42318\n--fout-zacht:#FDECEA  --radius:14px  --radius-s:8px  --max:1200px\n```\nDark sections hardcode extra colors instead of adding tokens: `#EDEBE4` (dark body text),\n`#DAD7CD` (top bar text), `#1F1E1B`/`#34322C` (dark card bg/border), `#B9B6AB` (dark\nmuted text) — reuse this pattern rather than tokenizing every dark variant.\n\n**Type scale**: body 17px/1.55 Source Sans 3; headings `clamp()`-sized (`h1: clamp(2rem,1.4rem + 2.4vw,3.4rem)`,\n`h2: clamp(1.5rem,1.2rem + 1.2vw,2.2rem)`), weight 800, `font-stretch` 106–108%,\n`letter-spacing:-.01em`, `text-wrap:balance`.\n\n**Key classes**: `.wrap` (centered max-width container); `.eyebrow` (small uppercase\nArchivo label); `.mark` (yellow underline-block highlight via `linear-gradient`, on hero\n`<h1>`); `.lead` (intro paragraph); `.topbalk` (thin black top bar); `.header` (sticky,\ntranslucent white, `backdrop-filter:blur(8px)`); `.woordmerk` (the \"buildflow\" logotype —\nbold \"build\" with a yellow `::after` highlight bar, lighter \"flow\" span); `.nav`\n(`.actief` = soft-yellow bg + inset bottom accent line); `.pil` (status pill: `.geel`,\n`.zwart`, `.rand`); `.knop` (pill button: yellow default, `.zwart`, `.rand` outline,\n`.klein` compact, hover lifts via `translateY(-1px)`); `.sectie` (section with responsive\nvertical padding; `.vlak` = light-grey fill; `.zwart` = full dark section with headings/\neyebrow/grey text repainted lighter — this modifier is how dark sections work, not a\nseparate dark-mode system); `.hero`/`.hero-grid` (two-column, 1 column ≤820px);\n`.volgende` (next-step card: 2px black border + hard yellow drop-shadow\n`box-shadow:6px 6px 0 var(--accent)`, reused on `.cp.in_progress` and `.proto-frame`);\n`.kpis`/`.kpi` (stat-tile grid, 7→4→2 columns); `.rail` (segmented progress bar); `.cps`/\n`.cp` (checkpoint cards on native `<details>/<summary>`, numbered badge `.nr`, status\nmodifiers `.in_progress`/`.blocked`/`.passed`); `.chip` (small status tag: `passed`,\n`running`, `failed`, `interrupted` dashed, `skipped` strikethrough, `feedback`); `.tabel`\n(bordered table; `.tabel.stack` turns rows into stacked label/value cards ≤820px via\n`td::before{content:attr(data-l)}` — the pattern to reuse for any tabular content);\n`.poging` (bordered attempt-summary card); `.finding` (3-col severity/text/status row,\ndashed top border); `.sev` (severity badge, red for blocker/critical/high/major, yellow\nfor medium); `.stepper`/`.stap` (phase stepper, top-border colored by state, 6→3 columns\n≤820px); `.prose`/`.md` (rendered-Markdown card); `.proto-frame` (embedded prototype\niframe, same hard shadow as `.volgende`); `.footer` (black, small grey text); `.toast`\n(fixed bottom-center black pill notification).\n\n**Breakpoints** (`max-width`): 1100px — KPI grid 7→4 cols. 820px — hero single-column,\ncheckpoint header collapses, tables become `.tabel.stack` cards, stepper 6→3 cols. 640px —\nbody font 16px, shorter prototype iframe, header goes static (not sticky), nav becomes a\nhorizontally scrollable strip with a right-edge fade mask and hidden scrollbar, KPI grid\n2 cols, bar-chart rows restack. `@media print` hides chrome and force-opens `<details>`.\n\n**JS**: plain vanilla, one inline `<script>`, no framework/build. Data arrives as\n`window.BF = /*__BF_DATA__*/null;`; the page is small template-string functions\n(`header()`, `hero()`, `cpCard()`, …) concatenated into `#app` — a hand-rolled,\ndependency-free render pattern — plus an in-file Markdown-to-HTML converter (`md()`) and\nan i18n table (`T = {en:{...}, nl:{...}}`) selected by `D.lang`. `localStorage`\n(try/catch-wrapped) is used only to remember draft feedback text per textarea.\n\n**Original inspiration**: the yellow variant of\n`~/projects/[ander project]/prototype` (`assets/site.css`) shares\nthe same token names/values (`--accent:#FFCE1F`, `--zwart:#141412`, `--inkt:#26251F`, …)\nand font pairing, confirming `viewer.html`'s style descends from that prototype's design\nsystem. Do not copy that file — it's a different project's asset — but it's a useful\nsecond reference for how the same tokens scale to a full multi-page site (it adds\n`.tekstlink`, `.kop-rij`, and a `body.thema-groen` accent-swap variant).\n\n## 8. UI and design\n\nNo `design.md` or equivalent exists for the buildflow website — none found.\n`references/design.md` describes the *process* buildflow follows to produce one for other\nprojects, not one for itself. No screenshots exist. No prototype exists yet for this\nfeature (`.buildflow/buildflow-website/state.json` shows `\"phase\":\"intake\"`, all stages\n`\"pending\"`).\n\n**Usable reference renders** of the viewer/report template from earlier buildflow test\nruns (good source for screenshots/layout examples of the house style), all rooted at\n`~/tmp/`:\n- `demo/.buildflow/verlofaanvragen/viewer.html` + `reports/{final,cp01,cp02,cp03}.html`\n- `demo2/.buildflow/verlofaanvragen/viewer.html` + `reports/{final,cp01,cp02,cp03}.html`\n- `demo3/.buildflow/rate-limit-test/viewer.html` + `reports/{final,cp01}.html`\n- `demo4/.buildflow/verlof-goedkeuren/viewer.html`\n- `demo5/.buildflow/verlof-goedkeuren/viewer.html` + `reports/{final,cp01,cp02}.html`\n\nThese are scratch/test data from developing buildflow itself (a fake \"verlofaanvragen\"\nleave-request feature), not real output for this repo — layout/style references only.\n\n## 9. Documentation\n\n- **Root `README.md`** (Dutch) — repo purpose, install/sync, skills table.\n- **`skills/buildflow/README.md`** (Dutch) — fullest doc: flow phase-by-phase, reporting,\n  viewer, install (whole-repo and single-skill symlink, plus an in-project\n  `.claude/skills/buildflow/` alternative for teams), sharing, file map, differences from\n  Helix/the video.\n- **`SKILL.md`** (English) — operative instructions, not narrative docs: phase table,\n  rules, exact command syntax.\n- **`references/*.md`** (English, 11 files) — per-phase/gate/role prompts.\n- The four other skills each have their own\n  self-contained `SKILL.md`, same pattern.\n- **No `docs/` folder exists any", "rel_root": "../", "active_checkpoint": "cp10", "tdd": {"cp01": {"scenarios": [{"name": "index.html parseert zonder niet-gesloten of verkeerd geneste elementen", "kind": "unit", "scenario": {"given": "index.html in de repo-root", "when": "tests/check_site.py hem met html.parser inleest en een st
