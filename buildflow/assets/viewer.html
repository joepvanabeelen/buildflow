<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__BF_TITLE__ · buildflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
:root{
  --accent:#FFCE1F; --accent-zacht:#FFF1B8; --accent-licht:#FFFAE6; --accent-diep:#8A6A00;
  --zwart:#141412; --inkt:#26251F; --grijs:#686559; --grijs-licht:#9C998D;
  --lijn:#E7E4DB; --vlak:#F7F6F2; --wit:#FFFFFF; --fout:#B42318; --fout-zacht:#FDECEA;
  --radius:14px; --radius-s:8px; --max:1200px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Source Sans 3','Segoe UI',system-ui,sans-serif;font-size:17px;line-height:1.55;color:var(--inkt);background:var(--wit);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.display{font-family:'Archivo','Arial Narrow',system-ui,sans-serif;color:var(--zwart);text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2rem,1.4rem + 2.4vw,3.4rem);font-weight:800;font-stretch:108%;line-height:1.04}
h2{font-size:clamp(1.5rem,1.2rem + 1.2vw,2.2rem);font-weight:800;font-stretch:106%;line-height:1.1}
h3{font-size:1.2rem;font-weight:750;line-height:1.25}
h4{font-size:1rem;font-weight:750}
a{color:inherit}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--zwart);outline-offset:3px;border-radius:4px}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.86em}
.wrap{max-width:var(--max);margin-inline:auto;padding-inline:clamp(16px,4vw,40px)}
.eyebrow{font-family:'Archivo',sans-serif;font-size:.74rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--grijs)}
.eyebrow,.prose,.md,.poging,.finding,code{overflow-wrap:anywhere}
.mark{background:linear-gradient(transparent 58%,var(--accent) 58%);padding:0 .08em}
.lead{font-size:1.18rem;line-height:1.5}
.grijs{color:var(--grijs)}
.klein{font-size:.9rem}

/* top bar + header */
.topbalk{background:var(--zwart);color:#DAD7CD;font-size:.86rem}
.topbalk .wrap{display:flex;gap:16px;align-items:center;justify-content:space-between;min-height:38px;flex-wrap:wrap}
.topbalk b{color:#fff}
.header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--lijn)}
.header .wrap{display:flex;align-items:center;gap:20px;min-height:64px;flex-wrap:wrap}
.woordmerk{display:flex;align-items:baseline;gap:.2em;font-family:'Archivo',sans-serif;color:var(--zwart);line-height:1;text-decoration:none}
.woordmerk b{font-weight:900;font-stretch:125%;font-size:1.45rem;letter-spacing:-.02em;position:relative;z-index:0}
.woordmerk b::after{content:'';position:absolute;left:-.06em;right:-.08em;bottom:.02em;height:.36em;background:var(--accent);z-index:-1}
.woordmerk span{font-weight:500;font-size:1.2rem}
.nav{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
.nav a{padding:8px 12px;border-radius:6px;font-weight:600;font-size:.95rem;text-decoration:none;white-space:nowrap}
.nav a:hover{background:var(--vlak)}
.nav a.actief{background:var(--accent-zacht);box-shadow:inset 0 -2px 0 var(--accent)}

/* pills, buttons */
.pil{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-family:'Archivo',sans-serif;font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.pil.geel{background:var(--accent);color:var(--zwart)}
.pil.zwart{background:var(--zwart);color:#fff}
.pil.rand{box-shadow:inset 0 0 0 1.5px var(--zwart);color:var(--zwart)}
.knop{text-decoration:none;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.95rem;padding:11px 20px;border-radius:999px;background:var(--accent);color:var(--zwart);white-space:nowrap;transition:transform .15s ease}
.knop:hover{transform:translateY(-1px)}
.knop.zwart{background:var(--zwart);color:#fff}
.knop.rand{background:transparent;box-shadow:inset 0 0 0 2px var(--zwart)}
.knop.klein{padding:7px 14px;font-size:.86rem}

/* sections */
.sectie{padding-block:clamp(40px,6vw,72px)}
.sectie.vlak{background:var(--vlak)}
.sectie.zwart{background:var(--zwart);color:#EDEBE4}
.sectie.zwart h2,.sectie.zwart h3,.sectie.zwart h4{color:#fff}
.sectie.zwart .eyebrow{color:var(--accent)}
.sectie.zwart .grijs{color:#B9B6AB}
.kop{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:26px}
.kop p{max-width:60ch}

.hero{padding-block:clamp(36px,5vw,64px) clamp(28px,4vw,48px)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:start}
.hero h1{margin:14px 0 16px}
.volgende{border:2px solid var(--zwart);border-radius:var(--radius);padding:20px 22px;background:var(--wit);box-shadow:6px 6px 0 var(--accent)}
.volgende .eyebrow{margin-bottom:8px;display:block}
.volgende p{font-weight:600}

/* KPI tiles: auto-fit so a tile never has to fit more than it can hold, values scale down and wrap
   instead of overflowing (long values like "1152/1152" or "312.47M") */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:28px}

.kpi{background:var(--wit);border:1px solid var(--lijn);border-radius:var(--radius);padding:16px 18px;min-width:0}
.kpi .w{font-family:'Archivo',sans-serif;font-weight:800;font-stretch:110%;font-size:clamp(1.05rem,0.85rem + 1vw,1.7rem);font-variant-numeric:tabular-nums;overflow-wrap:anywhere;color:var(--zwart);line-height:1.1;display:block}
.kpi .l{font-size:.84rem;color:var(--grijs)}
.sectie.zwart .kpi{background:#1F1E1B;border-color:#34322C}
.sectie.zwart .kpi .w{color:var(--accent)}
.sectie.zwart .kpi .l{color:#B9B6AB}

/* progress rail */
.rail{display:flex;gap:4px;margin-top:22px}
.rail i{flex:1;height:10px;border-radius:3px;background:var(--lijn)}
.rail i.passed{background:var(--zwart)}
.rail i.in_progress{background:var(--accent)}
.rail i.blocked{background:var(--fout)}

/* checkpoint cards */
.cps{display:grid;gap:12px}
.cp{background:var(--wit);border:1px solid var(--lijn);border-radius:var(--radius);overflow:hidden}
.cp.in_progress{border-color:var(--zwart);box-shadow:4px 4px 0 var(--accent)}
.cp.blocked{border-color:var(--fout)}
.cp summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 18px}
.cp summary::-webkit-details-marker{display:none}
.nr{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;background:var(--accent);font-family:'Archivo',sans-serif;font-weight:800;color:var(--zwart)}
.cp.passed .nr{background:var(--zwart);color:var(--accent)}
.cp h3{font-size:1.08rem}
.cp .sub{font-size:.93rem;color:var(--grijs);margin-top:2px}
.gates{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;white-space:nowrap;box-shadow:inset 0 0 0 1.5px var(--lijn);color:var(--grijs)}
.chip.passed{background:var(--zwart);color:var(--accent);box-shadow:none}
.chip.running{background:var(--accent);color:var(--zwart);box-shadow:none}
.chip.failed{background:var(--fout-zacht);color:var(--fout);box-shadow:inset 0 0 0 1.5px var(--fout)}
.chip.interrupted{background:var(--accent-licht);color:var(--accent-diep);box-shadow:none;border:1.5px dashed var(--accent-diep);padding:2px 9px}
.chip.skipped{box-shadow:inset 0 0 0 1.5px var(--lijn);color:var(--grijs-licht);text-decoration:line-through}
.chip.feedback{background:var(--accent-zacht);color:var(--accent-diep);box-shadow:none}
.cp-body{border-top:1px solid var(--lijn);padding:18px;display:grid;gap:18px;background:var(--accent-licht)}
.twee{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.blok h4{margin-bottom:6px}
ul.check{list-style:none;display:grid;gap:4px}
ul.check li{padding-left:24px;position:relative}
ul.check li::before{content:'';position:absolute;left:0;top:.45em;width:12px;height:12px;border-radius:3px;box-shadow:inset 0 0 0 2px var(--zwart)}
ul.check.done li::before{background:var(--zwart);box-shadow:inset 0 0 0 3px var(--accent)}
.tabel{width:100%;border-collapse:collapse;font-size:.92rem;background:var(--wit);border-radius:var(--radius-s);overflow:hidden}
.tabel th{font-family:'Archivo',sans-serif;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--grijs);text-align:left;padding:9px 12px;border-bottom:2px solid var(--zwart);background:var(--wit)}
.tabel td{padding:9px 12px;border-bottom:1px solid var(--lijn);vertical-align:top}
.tabel td.r,.tabel th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sectie.zwart .tabel{background:#1F1E1B}
.sectie.zwart .tabel th{background:#1F1E1B;color:#B9B6AB;border-color:var(--accent)}
.sectie.zwart .tabel td{border-color:#34322C}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.poging{background:var(--wit);border:1px solid var(--lijn);border-radius:var(--radius-s);padding:12px 14px;margin-top:8px}
.poging-kop{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:700}
.finding{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;font-size:.9rem;padding:6px 0;border-top:1px dashed var(--lijn)}
.sev{font-family:'Archivo';font-weight:800;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--vlak);height:fit-content}
.sev.blocker,.sev.critical,.sev.high,.sev.major{background:var(--fout);color:#fff}
.sev.medium{background:var(--accent)}
.feedback-box textarea{width:100%;min-height:70px;border:1.5px solid var(--lijn);border-radius:var(--radius-s);padding:10px 12px;background:var(--wit);resize:vertical}
.feedback-box textarea:focus{border-color:var(--zwart);outline:none}

/* bars */
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(90px,200px) minmax(0,1fr) auto;gap:12px;align-items:center;font-size:.92rem}
.bar .spoor{height:14px;background:#2A2925;border-radius:3px;overflow:hidden}
.bar .vul{height:100%;background:var(--accent);border-radius:3px;min-width:2px}
.bar .n{font-variant-numeric:tabular-nums;font-weight:700;color:#fff;white-space:nowrap}
.bar .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* stage stepper */
.stepper{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:26px;list-style:none}
.stap{border-top:5px solid var(--lijn);padding-top:8px;font-size:.84rem;color:var(--grijs-licht);min-width:0}
.stap b{display:block;font-family:'Archivo',sans-serif;font-weight:750;font-size:.92rem;color:var(--grijs)}
.stap.done{border-color:var(--zwart);color:var(--grijs)}
.stap.done b{color:var(--zwart)}
.stap.current{border-color:var(--accent)}
.stap.current b{color:var(--zwart)}
.stap.current span{color:var(--inkt);font-weight:600}
.stap.skipped{border-top-style:dotted}
.stap.skipped b{text-decoration:line-through;color:var(--grijs-licht)}
/* rendered markdown */
.prose{background:var(--wit);border:1px solid var(--lijn);border-radius:var(--radius);padding:clamp(16px,3vw,28px)}
.prose h1{font-size:1.5rem;margin:0 0 12px}.prose h2{font-size:1.2rem;margin:22px 0 8px}.prose h3{font-size:1.02rem;margin:18px 0 6px}
.prose h1:first-child,.prose h2:first-child{margin-top:0}
.prose p{margin:0 0 10px}.prose ul,.prose ol{margin:0 0 12px 1.2em}.prose li{margin:3px 0}
.prose code{background:var(--vlak);padding:1px 5px;border-radius:4px}
.prose a{text-decoration-color:var(--accent);text-decoration-thickness:2px}
details.ctx{background:var(--wit);border:1px solid var(--lijn);border-radius:var(--radius);margin-bottom:12px}
details.ctx summary{cursor:pointer;padding:14px 18px;font-weight:700;list-style:none;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px}
details.ctx summary::-webkit-details-marker{display:none}
details.ctx summary::after{content:'+';font-family:'Archivo';font-weight:800;margin-left:auto}
details.ctx[open] summary::after{content:'–'}
details.ctx .prose{border:0;border-top:1px solid var(--lijn);border-radius:0 0 var(--radius) var(--radius)}
.proto-frame{width:100%;height:640px;border:2px solid var(--zwart);border-radius:var(--radius);background:#fff;box-shadow:6px 6px 0 var(--accent)}
.statenrij{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.statenrij .chip{cursor:pointer;text-decoration:none;color:var(--inkt)}
.statenrij .chip.aan{background:var(--accent);color:var(--zwart);box-shadow:none}
.pad{display:block;margin-top:6px;word-break:break-all;color:var(--grijs)}
.melding{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-top:18px;padding:12px 14px;border-radius:var(--radius-s);background:var(--accent-licht);border:1.5px dashed var(--accent-diep);color:var(--inkt)}
.melding b{color:var(--accent-diep)}
.melding.hervat{background:var(--vlak);border:1px solid var(--lijn);color:var(--grijs);padding:8px 14px;font-size:.9rem}
.melding.hervat b{color:var(--grijs)}
.melding p{margin:0}
.melding-sluit{flex:none;width:32px;height:32px;margin:-4px -6px -4px 0;border-radius:6px;font-size:1.2rem;line-height:1;color:inherit}
.melding-sluit:hover{background:rgba(0,0,0,.06)}
.leeg{border:2px dashed var(--lijn);border-radius:var(--radius);padding:28px;text-align:center;color:var(--grijs)}
.md{white-space:pre-wrap;background:var(--wit);border:1px solid var(--lijn);border-radius:var(--radius);padding:18px 20px;font-size:.95rem}
.footer{background:var(--zwart);color:#B9B6AB;font-size:.86rem;padding-block:22px}
.footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--zwart);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.aan{opacity:1}
.toast.fout{background:var(--fout)}
.runregel{margin-top:28px;padding-top:14px;border-top:1px solid #34322C}

/* the checkpoint the run is on */
.cp.actief{border:2px solid var(--zwart);box-shadow:6px 6px 0 var(--accent)}
.cp.actief .nr{background:var(--zwart);color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
details.cp{scroll-margin-top:96px}
.rail i.actief{outline:2px solid var(--zwart);outline-offset:2px}
.terug{font-weight:600;font-size:.9rem;text-decoration:none;white-space:nowrap;padding:6px 10px;border-radius:6px}
.terug:hover{background:var(--vlak)}

/* overview of all runs (.buildflow/index.html) */
.runs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px}
.run-kaart{background:var(--wit);border:1px solid var(--lijn);border-radius:var(--radius);padding:18px 20px;display:grid;gap:10px;align-content:start;min-width:0}
.run-kaart.actief{border:2px solid var(--zwart);box-shadow:6px 6px 0 var(--accent)}
.run-kaart h3 a{text-decoration:none}
.run-kaart h3 a:hover{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px}
.run-kaart .rail{margin-top:2px}
.run-meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 14px;font-size:.9rem}
.run-meta dt{color:var(--grijs)}
.run-meta dd{font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.run-links{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.run-links .chip{text-decoration:none}
.run-links .chip:not(.passed):not(.failed){color:var(--inkt)}
.toast{max-width:calc(100vw - 32px);text-align:center;border-radius:18px}

/* live viewer (bf serve): actions and the inbox */
.knoppen{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:center}
.knop[disabled]{opacity:.55;cursor:progress;transform:none}
.live{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--grijs-licht);display:inline-block}
.live.aan i{background:var(--accent);box-shadow:0 0 0 3px rgba(255,206,31,.25)}
.live.uit{color:#F2A49C}
.acties{margin-top:14px;padding-top:14px;border-top:1.5px dashed var(--lijn)}
.acties .vraag{font-weight:700;margin-bottom:2px}
.acties .klaar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:600}
.inbox{margin-top:28px;border:2px solid var(--zwart);border-radius:var(--radius);background:var(--wit);padding:18px 20px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.inbox h3{margin-bottom:4px}
.inbox .feedback-box textarea{min-height:64px}
.inbox-lijst{list-style:none;display:grid;gap:8px;align-content:start}
.inbox-lijst li{border:1px solid var(--lijn);border-radius:var(--radius-s);padding:8px 12px;font-size:.92rem;background:var(--vlak);min-width:0}
.inbox-lijst .regel{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inbox-lijst .tekst{margin-top:4px;overflow-wrap:anywhere}
.inbox-lijst .noot{margin-top:4px;color:var(--grijs);overflow-wrap:anywhere}
.pil.st-new{background:var(--accent);color:var(--zwart)}
.pil.st-read{box-shadow:inset 0 0 0 1.5px var(--zwart);color:var(--zwart)}
.pil.st-handled{background:var(--zwart);color:#fff}
@media (max-width:820px){.inbox{grid-template-columns:1fr}}
@media (max-width:640px){.inbox{padding:14px}.knoppen .knop{white-space:normal;text-align:center}}

/* scenarios: the planned tests as BDD (Given/When/Then) */
ol.scenarios{list-style:none;display:grid;gap:8px}
.scenario{background:var(--wit);border:1px solid var(--lijn);border-left:4px solid var(--lijn);border-radius:var(--radius-s);padding:10px 14px;min-width:0}
.scenario.st-red,.scenario.st-red_wrong{border-left-color:var(--fout)}
.scenario.st-green{border-left-color:var(--zwart)}
.sc-kop{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.sc-naam{font-weight:700;overflow-wrap:anywhere;min-width:0}
.chip.soort{padding:1px 8px;font-size:.72rem}
.sc-state{margin-left:auto;font-family:'Archivo',sans-serif;font-weight:800;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:4px;background:var(--vlak);color:var(--grijs);white-space:nowrap}
.sc-state.red,.sc-state.red_wrong{background:var(--fout-zacht);color:var(--fout)}
.sc-state.green{background:var(--zwart);color:var(--accent)}
dl.gwt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;margin-top:6px;font-size:.93rem}
dl.gwt dt{font-family:'Archivo',sans-serif;font-weight:750;color:var(--zwart)}
dl.gwt dd{overflow-wrap:anywhere;min-width:0}
.sc-dekt,.sc-rood{margin-top:4px;overflow-wrap:anywhere}
.dw{display:inline-block;border-bottom:2px solid var(--accent);font-weight:600;color:var(--inkt);white-space:nowrap}
/* gate results: one row per gate (name, status, summary), its attempts as small blocks side by side */
.gate-rijen{display:grid;gap:10px}
.gate-rij{background:var(--wit);border:1px solid var(--lijn);border-radius:var(--radius-s);padding:12px 14px}
.gate-rij-kop h5{font-size:.98rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gate-rij-samenvatting{color:var(--grijs);font-size:.9rem;margin-top:4px}
.pogingen-rij{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pogingen-rij .poging{flex:1 1 240px;min-width:0;margin-top:0}
/* rows of items that used to sit side by side (questions, assumptions, out of scope) */
.rijen{display:grid;gap:18px}
/* static checks: tool names never break mid-word */
code.naam{white-space:nowrap;overflow-wrap:normal}
/* the checks table sits in a narrow gate column even on a wide screen: stack it by the width of its box */
.cp-body .blok{container-type:inline-size}
@container (max-width:520px){
  .tabel.stack.checks,.tabel.stack.checks tbody,.tabel.stack.checks tr,.tabel.stack.checks td{display:block;width:100%}
  .tabel.stack.checks{background:transparent}
  .tabel.stack.checks thead{display:none}
  .tabel.stack.checks tr{background:var(--wit);border:1px solid var(--lijn);border-radius:var(--radius-s);padding:8px 12px;margin-bottom:8px}
  .tabel.stack.checks td{border:0;padding:4px 0;display:flex;justify-content:space-between;gap:12px;text-align:right}
  .tabel.stack.checks td::before{content:attr(data-l);font-family:'Archivo',sans-serif;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--grijs);text-align:left;flex:none;padding-top:.2em}
  .tabel.stack.checks td.hoofd{display:block;font-weight:700;text-align:left}
  .tabel.stack.checks td.hoofd::before{display:none}
}
.uitslag{display:inline-flex;flex-wrap:wrap;gap:4px 6px;align-items:center;justify-content:flex-end}

section[id]{scroll-margin-top:84px}
@media (max-width:820px){
  .hero-grid{grid-template-columns:1fr}
  .cp summary{grid-template-columns:auto minmax(0,1fr)}
  .cp summary .gates{grid-column:1 / -1;justify-content:flex-start}
  .bar{grid-template-columns:minmax(80px,120px) minmax(0,1fr) auto}
  .kop{align-items:start}
}
@media (max-width:820px){
  /* tables become stacked cards */
  .scroll{overflow:visible}
  .tabel.stack,.tabel.stack tbody,.tabel.stack tr,.tabel.stack td{display:block;width:100%}
  .tabel.stack{background:transparent}
  .tabel.stack thead{display:none}
  .tabel.stack tr{background:var(--wit);border:1px solid var(--lijn);border-radius:var(--radius-s);padding:8px 12px;margin-bottom:8px}
  .tabel.stack td{border:0;padding:4px 0;display:flex;justify-content:space-between;gap:12px;text-align:right}
  .tabel.stack td::before{content:attr(data-l);font-family:'Archivo',sans-serif;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--grijs);text-align:left;flex:none;padding-top:.2em}
  .tabel.stack td.hoofd{display:block;font-weight:700;text-align:left;font-size:1rem}
  .tabel.stack td.hoofd::before{display:none}
  .sectie.zwart .tabel.stack tr{background:#1F1E1B;border-color:#34322C}
  .sectie.zwart .tabel.stack td::before{color:#B9B6AB}
  .tabel.stack tr{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));column-gap:24px}
  .tabel.stack td.hoofd{grid-column:1 / -1}
}
@media (max-width:820px){
  .stepper{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:14px}
}
@media (max-width:640px){
  body{font-size:16px}
  .proto-frame{height:520px;box-shadow:4px 4px 0 var(--accent)}
  .topbalk .upd{display:none}
  .header{position:static}
  .header .wrap{min-height:52px;gap:4px 10px;flex-wrap:wrap;padding-top:8px}
  .woordmerk b{font-size:1.2rem}.woordmerk span{font-size:1rem}
  .header .pil{font-size:.64rem;padding:3px 8px}
  .nav{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -9px;width:calc(100% + 18px);min-width:0;-webkit-mask-image:linear-gradient(to right,#000 82%,transparent);mask-image:linear-gradient(to right,#000 82%,transparent);padding-right:24px}
  .nav::-webkit-scrollbar{display:none}
  .nav a{padding:7px 9px;font-size:.88rem}
  section[id]{scroll-margin-top:0}
  .sectie{padding-block:36px}
  .kpis,.sectie.zwart .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:12px 14px}.kpi .w{font-size:1.4rem}
  .cp summary{padding:14px;gap:12px}
  .cp-body{padding:14px}
  .volgende{box-shadow:4px 4px 0 var(--accent)}
  .bar{grid-template-columns:minmax(0,1fr) auto;row-gap:4px}
  .bar .spoor{grid-column:1 / -1;grid-row:2}
  .finding{grid-template-columns:auto minmax(0,1fr)}
  .finding>span:last-child{grid-column:2}
}
@media print{
  .header,.nav,.feedback-box,.knop,.toast,.inbox,.acties{display:none!important}
  details.cp{break-inside:avoid}
  details.cp>.cp-body{display:grid!important}
  .sectie{padding-block:24px}
  body{font-size:12px}
}

    .replace(/(^|\W)\*([^*\s][^*]*)\*(?=\W|$)/g,"$1<i>$2</i>")

  const flushL = () => { if(list){ out += `</${list}>`; list = null; } };

    const l = raw.trimEnd();

    <span class="pil ${ph==="done"?"zwart":ph.startsWith("awaiting")?"geel":"rand"}">${esc(L.phase[ph]||ph)}</span>
    ${D.profile ? `<span class="pil rand" title="${esc((L.profTip||{})[D.profile]||"")}">${esc(L.profileL)}: ${esc((L.profL||{})[D.profile]||D.profile)}</span>` : ""}
    ${D.focus ? "" : `<nav class="nav">${(window.__nav||[]).map(([id,lbl])=>`<a href="#${id}">${esc(lbl)}</a>`).join("")}</nav>`}
  </div></header>`;
}

function hero(){
  const s = stats(), c = D.cost, t = c && c.time;
  const cp = scopeId() && (D.checkpoints||[]).find(x => x.id===scopeId());
  if(cp){
    // checkpoint report: this checkpoint's gates, tests, findings and cost; run progress is one tile
    const one = stats([cp]), sc = scoped() || {}, b = sc.b;
    return `<section class="hero" id="top"><div class="wrap">
      <div class="hero-grid">
        <div><span class="eyebrow">${esc(L.cpReport)} · ${esc(cp.id)}</span><h1><span class="mark">${esc(cp.title)}</span></h1><p class="lead">${inline(D.title)}</p></div>
        <div class="volgende"><span class="eyebrow">${L.next}</span><p>${inline(nextText())}</p></div>
      </div>
      <div class="kpis">
        <div class="kpi"><span class="w">${s.passed}/${s.n}</span><span class="l">${L.cpPassedRun}</span></div>
        <div class="kpi"><span class="w">${one.gatesPassed}/${one.gates}</span><span class="l">${L.gatesPassed}</span></div>
        <div class="kpi"><span class="w">${one.tp}/${one.tt}</span><span class="l">${L.tests}</span></div>
        <div class="kpi"><span class="w">${one.fFixed}/${one.fTotal}</span><span class="l">${L.findings}</span></div>
        <div class="kpi"><span class="w">${b?tok(b.total_tokens):"–"}</span><span class="l">${L.tokens}</span></div>
        <div class="kpi"><span class="w">${b?usd(b.usd):"–"}</span><span class="l">${L.cost}</span></div>
        <div class="kpi"><span class="w">${dur(sc.active)}</span><span class="l">${L.active}</span></div>
      </div>
    </div></section>`;
  }
  const focusLabel = D.focus==="final" ? L.finalReport : D.focus ? `${L.cpReport} · ${D.focus}` : `${L.feature} · ${D.slug}`;
  return `<section class="hero" id="top"><div class="wrap">
    <div class="hero-grid">
      <div><span class="eyebrow">${esc(focusLabel)}</span><h1><span class="mark">${esc(D.title)}</span></h1>
        ${D.goal ? `<p class="lead">${inline(D.goal)}</p>` : ""}</div>
      <div class="volgende"><span class="eyebrow">${L.next}</span><p>${inline(nextText())}</p>${LIVE && !D.focus ? `<div id="bf-acties-slot"></div>` : ""}</div>
    </div>
    ${interruptNotice()}
    ${LIVE && !D.focus ? `<div id="bf-inbox-slot"></div>` : ""}
    ${stepper()}
    ${(D.checkpoints||[]).length ? `<div class="rail" aria-hidden="true">${(D.checkpoints||[]).map(c=>`<i class="${c.status}${c.id===activeId()?" actief":""}" title="${esc(c.id)} ${esc(c.title)}"></i>`).join("")}</div>
    <div class="kpis">
      <div class="kpi"><span class="w">${s.passed}/${s.n}</span><span class="l">${L.cpPassed}</span></div>
      <div class="kpi"><span class="w">${s.gatesPassed}/${s.gates}</span><span class="l">${L.gatesPassed}</span></div>
      <div class="kpi"><span class="w">${s.tp}/${s.tt}</span><span class="l">${L.tests}</span></div>
      <div class="kpi"><span class="w">${s.fFixed}/${s.fTotal}</span><span class="l">${L.findings}</span></div>
      <div class="kpi"><span class="w">${c?tok(c.totals.total_tokens):"–"}</span><span class="l">${L.tokens}</span></div>
      <div class="kpi"><span class="w">${c?usd(c.totals.usd):"–"}</span><span class="l">${L.cost}</span></div>
      <div class="kpi"><span class="w">${t?dur(t.active_seconds):"–"}</span><span class="l">${L.active}</span></div>
    </div>` : ""}
  </div></section>`;
}

function testsTable(tests){
  if(!tests || !tests.length) return `<p class="grijs klein">–</p>`;
  return `<div class="scroll"><table class="tabel stack"><thead><tr><th>${L.name}</th><th>${L.kind}</th><th>${L.covers}</th></tr></thead><tbody>
    ${tests.map(t => typeof t==="string" ? `<tr><td class="hoofd" colspan="3">${inline(t)}</td></tr>` : `<tr><td class="hoofd">${inline(t.name||t.title)}</td><td data-l="${L.kind}">${esc(t.kind||"")}</td><td data-l="${L.covers}">${inline(t.covers||t.given_when_then||"")}</td></tr>`).join("")}
  </tbody></table></div>`;
}

// ---- test-first: the planned scenarios (Given/When/Then) and the red -> green evidence of the behavior gate.
// bf puts a summary per checkpoint in D.tdd; data from an older bf has none, then only the test names show.
function tddOf(cp){
  const x = (D.tdd||{})[cp.id]; if(x) return x;
  const tests = (cp.tests||[]).map(t => typeof t==="string" ? {name:t} : t);
  return {scenarios: tests.map(t => ({name:t.name||t.title||"", kind:t.kind||"", scenario:null, done_when:[], covers:t.covers||"", text:t.given_when_then||"", state:"planned"})),
          planned:tests.length, with_scenario:0, red:null, green:null, red_confirmed:null, tests_new:null};
}
function scenarioItem(x, showState){
  const g = L.gwt, s = x.scenario;
  const dw = (x.done_when||[]).map(d => `<span class="dw"${d.text?` title="${esc(d.text)}"`:""}>${esc(fill(L.doneWhenN,{n:d.n}))}</span>`).join(" ");
  return `<li class="scenario st-${esc(x.state)}">
    <div class="sc-kop"><b class="sc-naam">${inline(x.name)}</b>${x.kind?`<span class="chip soort" title="${esc(x.kind)}">${esc((L.kindL||{})[x.kind]||x.kind)}</span>`:""}${showState?`<span class="sc-state ${esc(x.state)}">${esc(L.scL[x.state]||x.state)}</span>`:""}</div>
    ${s ? `<dl class="gwt"><dt>${esc(g[0])}</dt><dd>${inline(s.given)}</dd><dt>${esc(g[1])}</dt><dd>${inline(s.when)}</dd><dt>${esc(g[2])}</dt><dd>${inline(s.then)}</dd></dl>`
        : x.text ? `<p class="klein">${inline(x.text)}</p>` : ""}
    ${dw ? `<p class="klein grijs sc-dekt">${esc(L.provesL)}: ${dw}</p>` : x.covers ? `<p class="klein grijs sc-dekt">${esc(L.covers)}: ${inline(x.covers)}</p>` : ""}
    ${showState && x.red_reason && x.state!=="green" ? `<p class="klein grijs sc-rood">✕ ${inline(x.red_reason)}</p>` : ""}
  </li>`;
}
function scenarioBlock(cp){
  const td = tddOf(cp), sc = td.scenarios||[];
  const head = td.with_scenario ? L.scenarios : L.plannedTests;
  if(!sc.length) return `<div class="blok"><h4>${esc(head)} (0)</h4><p class="grijs klein">–</p></div>`;
  return `<div class="blok"><h4>${esc(head)} (${sc.length})</h4><ol class="scenarios">${sc.map(x => scenarioItem(x, cp.status!=="pending")).join("")}</ol></div>`;
}
function tddTotals(){
  const cps = D.checkpoints||[], rows = cps.map(c => [c, tddOf(c)]);
  if(!rows.some(([,x]) => x.planned || x.red || x.green)) return "";
  const sum = f => rows.reduce((a,[,x]) => a + (+f(x)||0), 0);
  const line = fill(L.tddTotalsLine, {scen:sum(x=>x.with_scenario), planned:sum(x=>x.planned), nw:sum(x=>x.tests_new)});
  return `<h3 style="margin:28px 0 6px">${esc(L.tddTotals)}</h3>
    <p class="klein" style="margin-bottom:10px"><b>${esc(line)}</b></p>
    <div class="scroll"><table class="tabel stack"><thead><tr><th>${L.checkpoints}</th><th class="r">${esc(L.thPlanned)}</th><th class="r">${esc(L.thScen)}</th><th class="r">${esc(L.thNew)}</th><th>${esc(L.thGreen)}</th></tr></thead><tbody>
    ${rows.map(([c,x]) => `<tr><td class="hoofd" data-l="#">${c.n}. <a href="#${c.id}">${esc(c.title)}</a></td><td class="r" data-l="${esc(L.thPlanned)}">${x.planned}</td><td class="r" data-l="${esc(L.thScen)}">${x.with_scenario}</td><td class="r" data-l="${esc(L.thNew)}">${x.tests_new ?? "–"}</td><td data-l="${esc(L.thGreen)}">${x.green ? `${esc(x.green.tests_passed ?? "?")}/${esc(x.green.tests_total ?? "?")}` : "–"}</td></tr>`).join("")}
    </tbody></table></div>`;
}

// one row per gate: name, status and a one-line summary; its attempts sit below as small blocks side by side
function gateRow(cp, g){
  const gs = gate(cp,g);
  if(gs.status==="skipped") return `<div class="gate-rij"><div class="gate-rij-kop"><h5 title="${esc(g)}">${L[g]} <span class="chip skipped">${esc(L.skipped)}</span></h5></div><p class="gate-rij-samenvatting">${inline(known(gs.skip_reason||""))}</p></div>`;
  const at = gs.attempts||[];
  const last = at.length ? at[at.length-1] : null;
  return `<div class="gate-rij"><div class="gate-rij-kop"><h5 title="${esc(g)}">${L[g]} <span class="chip ${esc(gs.status)}">${esc(statL(gs.status))}</span></h5></div>
    ${last && last.summary ? `<p class="gate-rij-samenvatting">${inline(known(last.summary))}</p>` : ""}
    ${g==="static" && last && last.checks ? checksTable(last.checks, last.metrics) : ""}
    ${at.length ? `<div class="pogingen-rij">${attemptsHtml(at)}</div>` : `<p class="klein grijs">${L.noAttempts}</p>`}
  </div>`;
}
// the checks of the latest static run: one row per tool
// a tool that only finds what the baseline already had reads as clean; only new blocking findings look alarming
function checkResult(c){
  if(c.status==="crashed"||c.status==="timeout") return `<span class="chip failed">${esc((L.chkL||{})[c.status]||c.status)}</span>`;
  if(c.status==="skipped") return `<span class="chip skipped">${esc((L.chkL||{})[c.status])}</span>`;
  const nw = c.new, base = c.baseline||0;
  if(nw==null) return `<span class="chip ${c.status==="clean"?"passed":""}">${esc((L.chkL||{})[c.status]||c.status)}</span>`;
  if(!nw) return `<span class="chip passed">${esc(L.chkClean)}</span>${base?` <span class="klein grijs">${esc(fill(L.chkBase,{n:base}))}</span>`:""}`;
  return `<span class="chip ${c.blocking_new?"failed":""}">${esc(fill(L.chkNew,{n:nw}))}</span>${c.blocking_new?` <span class="klein">${esc(fill(L.chkBlockingNew,{n:c.blocking_new}))}</span>`:""}${base?` <span class="klein grijs">${esc(fill(L.chkBase,{n:base}))}</span>`:""}`;
}
function checksTable(checks, m){
  // runs from before bf split new and baseline per check: when the run had no new findings, what a tool found was baseline
  if(m && +m.new_findings===0) checks = checks.map(c => c.new==null && c.status==="findings" ? {...c, new:0, baseline:c.findings||0} : c);
  return `<div class="scroll"><table class="tabel stack checks"><thead><tr><th>${L.chkName}</th><th>${L.chkKind}</th><th>${L.chkStatus}</th><th class="r">${L.chkSecs}</th></tr></thead><tbody>
    ${checks.map(c => `<tr><td class="hoofd"><code class="naam">${esc(c.name)}</code></td><td data-l="${L.chkKind}">${esc((L.kindL||{})[c.kind]||c.kind||"")}</td><td data-l="${L.chkStatus}"><span class="uitslag">${checkResult(c)}${c.note?` <span class="grijs klein">${esc(c.note)}</span>`:""}</span></td><td class="r" data-l="${L.chkSecs}">${c.seconds!=null?esc(c.seconds)+"s":"–"}</td></tr>`).join("")}
  </tbody></table></div>`;
}
// the configured check set (approved with the plan) and, once building, the results per checkpoint
// the configured check set, approved with the plan; per-checkpoint results are in each checkpoint's own
// gate row (checksTable), not repeated here as a second, near-identical overview
function staticBlock(){
  const sc = D.static || {};
  const cps = D.checkpoints||[];
  if(sc.checks==null && !cps.some(c => (gate(c,"static").attempts||[]).length)) return "";
  const checks = sc.checks||[], bl = sc.baseline, na = sc.not_available||[];
  const cfg = sc.checks==null ? `<p class="klein grijs">${L.staticUnset}</p>`
    : !checks.length ? `<p class="klein">${L.staticNone}: ${inline(sc.reason||"–")}</p>`
    : `<div class="scroll"><table class="tabel stack"><thead><tr><th>${L.chkName}</th><th>${L.chkKind}</th><th>${L.chkScope}</th><th>${L.chkBlocking}</th></tr></thead><tbody>
        ${checks.map(c => `<tr><td class="hoofd"><code class="naam">${esc(c.name)}</code><div class="klein grijs"><code>${esc(c.cmd)}</code></div></td><td data-l="${L.chkKind}">${esc((L.kindL||{})[c.kind]||c.kind)}</td><td data-l="${L.chkScope}">${esc((L.scopeL||{})[c.scope]||c.scope)}</td><td data-l="${L.chkBlocking}">${c.blocking===false?esc(L.reportOnly):esc(L.blocksYes)}</td></tr>`).join("")}
      </tbody></table></div>
      <p class="klein grijs" style="margin-top:8px">${L.baseline}: ${bl ? `${bl.findings} ${L.preExisting} · <code>${esc((bl.commit||"").slice(0,10))}</code>` : L.noBaseline}</p>`;
  return `<h3 style="margin:28px 0 6px">${L.staticTitle}</h3>
    <p class="klein grijs" style="margin-bottom:10px">${L.staticIntro}</p>
    ${cfg}
    ${na.length ? `<p class="klein grijs" style="margin-top:8px">${L.notAvailable}: ${na.map(n => `<code>${esc(n.name)}</code>${n.reason?` (${esc(n.reason)})`:""}`).join(", ")}</p>` : ""}`;
}

function cpCard(cp, open){
  const c = D.cost, b = c && c.by_checkpoint[cp.id], sec = c && c.time.checkpoint_seconds[cp.id];
  const planMode = D.phase==="awaiting_plan_approval" && !D.focus;
  const key = `bf:${D.slug}:fb:${cp.id}`;
  const act = cp.id === activeId();
  return `<details class="cp ${cp.status}${act?" actief":""}" ${open||act?"open":""} id="${cp.id}"${act?' aria-current="step"':""}>
    <summary><span class="nr">${cp.n}</span>
      <div><h3>${act ? `<span class="chip running">▶ ${esc(cp.status==="pending" ? L.nextCp : L.nowCp)}</span> ` : ""}${esc(cp.title)} ${cp.source==="feedback"?`<span class="chip feedback">${L.fromFeedback}</span>`:""}${cp.wave!=null?` <span class="chip" title="${esc(L.wave)} ${esc(cp.wave)}">${esc(L.wave)} ${esc(cp.wave)}</span>`:""}</h3><div class="sub">${inline(cp.summary)}</div></div>
      <div class="gates">${GATES.map(g=>chip(cp,g)).join("")}</div>
    </summary>
    <div class="cp-body">
      <div class="twee">
        ${cp.why ? `<div class="blok"><h4>${L.why}</h4><p>${inline(cp.why)}</p></div>` : ""}
        ${(cp.done_when||[]).length ? `<div class="blok"><h4>${L.doneWhen}</h4><ul class="check ${cp.status==="passed"?"done":""}">${cp.done_when.map(x=>`<li>${inline(x)}</li>`).join("")}</ul></div>` : ""}
      </div>
      ${cp.ui_scope ? `<p class="klein"><b>${esc(L.uiScope)}:</b> ${inline(cp.ui_scope)}</p>` : ""}
      ${cp.docs_scope ? `<p class="klein"><b>${esc(L.docsScope)}:</b> ${inline(cp.docs_scope)}</p>` : ""}
      ${scenarioBlock(cp)}
      ${cp.status!=="pending" ? `<div class="blok"><h4>${L.gateResults}</h4><div class="gate-rijen">${GATES.map(g=>gateRow(cp,g)).join("")}</div></div>` : ""}
      ${(cp.started_at) ? `<p class="klein grijs">${L.duration}: <b>${dur(sec)}</b> · ${L.cpCost}: <b>${b?usd(b.usd):"–"}</b> (${b?tok(b.total_tokens):"–"} ${L.tokens}) · ${L.commit}: <code>${esc((cp.commit||"–").slice(0,10))}</code>${cp.report && !D.focus?` · <a href="${esc(cp.report)}">${L.report}</a>`:""}</p>` : ""}
      ${planMode ? `<div class="feedback-box"><label class="klein" for="fb-${cp.id}"><b>${L.yourFeedback}</b></label><textarea id="fb-${cp.id}" data-key="${esc(key)}" data-cp="${cp.id}">${esc(store.get(key)||"")}</textarea>${fbButtons("fb-"+cp.id, false)}</div>` : ""}
    </div>
  </details>`;
}

function planSection(){
  const cps = D.checkpoints||[];
  if(!cps.length && phaseIdx() < 3) return "";
  const planMode = D.phase==="awaiting_plan_approval";
  const list = (title, arr) => arr && arr.length ? `<div class="blok"><h4>${title}</h4><ul class="check">${arr.map(q=>`<li>${typeof q==="string" ? inline(q) : inline(q.q||q.question||"") + (q.a||q.answer ? ` → <b>${inline(q.a||q.answer)}</b>` : "")}</li>`).join("")}</ul></div>` : "";
  const gkey = `bf:${D.slug}:fb:general`;
  return `<section class="sectie vlak" id="plan"><div class="wrap">
    <div class="kop"><div><span class="eyebrow">${L.checkpoints}</span><h2>${L.plan}</h2></div><p class="grijs">${L.planIntro}</p></div>
    ${cps.length ? `<div class="cps">${cps.map(c=>cpCard(c, planMode || c.status==="in_progress" || c.status==="blocked")).join("")}</div>` : `<div class="leeg">${L.empty}</div>`}
    <div class="rijen" style="margin-top:22px">${list(L.questions, D.questions)}${list(L.assumptions, D.assumptions)}${list(L.outOfScope, D.out_of_scope)}</div>
    ${phaseIdx() < 4 ? staticBlock() : ""}
    ${planMode ? `<div class="feedback-box" style="margin-top:22px"><label for="fb-general"><b>${L.generalFeedback}</b></label><textarea id="fb-general" data-key="${esc(gkey)}" data-cp="general">${esc(store.get(gkey)||"")}</textarea>
      ${fbButtons("fb-general", true)}</div>` : ""}
  </div></section>`;
}

function featureDocsBlock(){
  const fd = stg("docs"), at = fd.attempts || [];
  if(phaseIdx() < 4 || (!at.length && D.phase!=="documenting")) return "";
  const cpFiles = (D.checkpoints||[]).flatMap(c => (c.gates.docs && c.gates.docs.attempts || []).flatMap(a => a.files||[]));
  const files = [...new Set([...cpFiles, ...at.flatMap(a => a.files||[]), stg("design").design_md, stg("design").prototype].filter(Boolean))];
  return `<h3 style="margin:28px 0 6px">${L.featureDocs} <span class="chip ${esc(fd.status||"pending")}">${esc(statL(fd.status||"pending"))}</span></h3>
    <p class="klein grijs" style="margin-bottom:10px">${L.featureDocsIntro}</p>
    ${at.length ? attemptsHtml(at) : ""}
    ${files.length ? `<div class="poging"><div class="poging-kop">${L.docFiles} (${files.length})</div>${files.map(f=>`<div class="klein"><a href="${esc(relLink(f))}"><code>${esc(f)}</code></a></div>`).join("")}</div>` : ""}`;
}

function finalGatesBlock(){
  const f = D.final;
  if(!f) return "";
  const GS = ["review","ui","docs"];
  return `<h3 style="margin:28px 0 6px">${L.finalGates}</h3>
    <p class="klein grijs" style="margin-bottom:10px">${L.finalGatesIntro}</p>
    <div class="gates" style="margin-bottom:10px">${GS.map(g=>{const s=(f[g]||{}).status||"pending"; const icon=s==="passed"?"✓":s==="failed"?"✕":s==="running"?"●":"";
      return `<span class="chip ${s}" title="${esc(L.gateTip)} ${esc(g)} · ${esc(statL(s))}">${icon} ${esc(L[g])}</span>`;}).join(" ")}</div>
    ${GS.map(g=>{const gs=f[g]||{}; const at=gs.attempts||[]; if(!at.length && !gs.skip_reason) return "";
      return `<div class="poging"><div class="poging-kop">${esc(L[g])} <span class="chip ${gs.status||"pending"}">${esc(statL(gs.status||"pending"))}</span></div>
        ${gs.skip_reason ? `<p class="klein grijs">${esc(gs.skip_reason)}</p>` : attemptsHtml(at)}</div>`;}).join("")}`;
}

function progressSection(){
  const cps = D.checkpoints||[];
  if(phaseIdx() < 4 && !cps.some(c=>c.status!=="pending")) return "";
  const fb = D.feedback||[];
  return `<section class="sectie" id="progress"><div class="wrap">
    <div class="kop"><div><span class="eyebrow">${L.gateResults}</span><h2>${L.progress}</h2></div></div>
    <div class="scroll"><table class="tabel stack"><thead><tr><th>${L.checkpoints}</th>${GATES.map(g=>`<th>${L[g]}</th>`).join("")}<th class="r">${L.findings}</th><th class="r">${L.duration}</th><th class="r">${L.cpCost}</th></tr></thead><tbody>
    ${cps.map(cp => { const f=allFindings(cp); const b=D.cost&&D.cost.by_checkpoint[cp.id]; return `<tr><td class="hoofd" data-l="#">${cp.n}. <a href="#${cp.id}">${esc(cp.title)}</a></td>${GATES.map(g=>`<td data-l="${L[g]}">${chip(cp,g)}</td>`).join("")}<td class="r" data-l="${L.findings}">${f.filter(x=>x.status==="fixed").length}/${f.length}</td><td class="r" data-l="${L.duration}">${dur(D.cost&&D.cost.time.checkpoint_seconds[cp.id])}</td><td class="r" data-l="${L.cpCost}">${b?usd(b.usd):"–"}</td></tr>`; }).join("")}
    </tbody></table></div>
    ${tddTotals()}
    ${staticBlock()}

function bars(map){

}

function render(){
  L = T[D.lang] || T.en;
  document.documentElement.lang = D.lang || "en";
  let body, parts;
  const early = phaseIdx() < 4;
  if(D.focus && D.focus!=="final"){
    const cp = (D.checkpoints||[]).find(c=>c.id===D.focus);
    body = hero() + `<section class="sectie vlak"><div class="wrap"><div class="cps">${cp?cpCard(cp,true):""}</div><p style="margin-top:18px"><a class="knop rand klein" href="../viewer.html">${L.back}</a></p></div></section>` + costSection();
  } else {
    const S = {brief:[briefSection,L.brief], design:[designSection,L.design], plan:[planSection,L.plan], progress:[progressSection,L.progress],
               costs:[costSection,L.costs], context:[contextSection,L.context], learnings:[learnSection,L.learnings]};
    const order = D.focus==="final" ? ["progress","costs","brief","design","plan","context","learnings"]
                : early ? (() => { const cur = ({1:"brief",2:"design",3:"plan"})[phaseIdx()];
                    const base = ["brief","design","plan","context","costs","learnings"];
                    return cur ? [cur, ...base.filter(k => k!==cur)] : base; })()
                : ["progress","plan","costs","brief","design","context","learnings"];
    parts = order.map(k => [k, S[k][0](), S[k][1]]).filter(x => x[1]);

}

function copyFeedback(){
  const parts = [];
  document.querySelectorAll("textarea[data-cp]").forEach(t => {
    const v = t.value.trim(); if(!v || t.dataset.cp==="msg") return;
    if(t.dataset.cp==="general" || t.dataset.cp==="brief" || t.dataset.cp==="design") parts.unshift(`${t.dataset.cp==="general" ? L.fbGeneral : L[t.dataset.cp]}: ${v}`);
    else { const cp = D.checkpoints.find(c=>c.id===t.dataset.cp); parts.push(`${t.dataset.cp} (${cp?cp.title:""}): ${v}`); }
  });
  const stage = D.phase==="awaiting_brief_approval" ? "brief" : D.phase==="awaiting_design_approval" ? "design" : "plan";
  const txt = parts.length ? fill(L.fbCopyHead, {stage: String(L[stage]||stage).toLowerCase(), slug: D.slug}) + "\n\n" + parts.map(p=>"- "+p).join("\n") : "";
  if(!txt) return toast(L.noFeedback);
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>toast(L.copied)).catch(()=>{ window.prompt(L.copyPrompt, txt); });
}

let toastTimer;
function toast(m, err){
  const e = $("#toast"); e.textContent = m; e.classList.toggle("fout", !!err); e.classList.add("aan");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { e.classList.remove("aan"); setTimeout(() => { if(!e.classList.contains("aan")) e.textContent = ""; }, 300); }, err ? 6000 : 2600);
}

function bindBoxes(scope){
  scope.querySelectorAll("textarea[data-key]").forEach(t => t.addEventListener("input", () => { lastInput = Date.now(); store.set(t.dataset.key, t.value); }));

}

// ---- live viewer (bf serve): everything below only runs when the page was served with a token
function api(path, body){
  const h = {"X-BF-Token": TOKEN};
  if(body) h["Content-Type"] = "application/json";
  return fetch(path, {method: body ? "POST" : "GET", headers: h, cache: "no-store", body: body ? JSON.stringify(body) : undefined})
    .then(r => r.json().catch(() => ({})).then(j => ({status: r.status, j})));
}
function errText(res){
  if(!res) return L.errOffline;
  const c = res.j && res.j.code;
  if(res.status === 403) return L.errToken;
  if(c === "duplicate") return L.errDup;
  if(c === "wrong_phase") return L.errPhase;
  if(c === "text_required") return L.errText;
  if(c === "too_large") return L.errSize;
  return (res.j && res.j.error) || ("HTTP " + res.status);
}
function post(body, btn){
  if(btn){ btn.disabled = true; btn.setAttribute("aria-busy","true"); }
  const done = () => { if(btn && btn.isConnected){ btn.disabled = false; btn.removeAttribute("aria-busy"); } };
  return api("/api/action", body).then(res => {
    done(); setLive(true);
    if(res.status === 200){ toast(L.sent); loadInbox(); return true; }
    toast(errText(res), true);
    if(res.j && res.j.code === "wrong_phase"){ VER = {}; }  // force a refresh on the next poll
    return false;
  }, () => { done(); setLive(false); toast(L.errOffline, true); return false; });
}
function currentCp(){ const c = (D.checkpoints||[]).find(x => x.status==="in_progress" || x.status==="blocked"); return c ? c.id : null; }
function sendBox(btn){
  const t = document.getElementById(btn.dataset.for); if(!t) return;
  const text = t.value.trim();
  if(!text){ toast(L.errText, true); t.focus(); return; }
  const cp = t.dataset.cp, body = {type:"feedback", text};
  if(cp==="brief" || cp==="design") body.stage = cp;
  else if(cp==="general") body.stage = "plan";
  else if(/^cp\d+$/.test(cp)){ body.stage = D.phase==="awaiting_plan_approval" ? "plan" : "checkpoint"; body.target = cp; }
  else if(cp==="msg"){
    if(D.phase==="awaiting_human_review") body.stage = "review";
    else { body.type = "message"; const c = currentCp(); if(c && (D.phase==="building"||D.phase==="paused")) body.target = c; }
  }
  post(body, btn).then(ok => { if(ok){ t.value = ""; store.set(t.dataset.key, ""); } });
}

function isCombinedBriefPlan(){
  // klein/middel/fast runs may skip the separate brief stop: the viewer never shows awaiting_brief_approval
  // in that case, phase jumps straight to awaiting_plan_approval with the brief stage still unapproved.
  return D.phase==="awaiting_plan_approval" && stg("brief").status!=="approved" && stg("brief").status!=="skipped";

  return `<div class="acties"><p class="knoppen"><button type="button" class="knop" id="bf-keur">✓ ${esc(L.approve[label])}</button></p></div>`;
}

        <textarea id="fb-msg" data-key="${esc(key)}" data-cp="msg">${esc(store.get(key)||"")}</textarea>${fbButtons("fb-msg", false)}</div></div>
    ${items.length ? `<ol class="inbox-lijst" aria-label="${esc(L.inbox)}">${items.map(x => `<li>
        <div class="regel"><span class="pil st-${esc(x.status)}">${esc(L.stL[x.status]||x.status)}</span><b>${esc(L.typeL[x.type]||x.type)}</b><span class="grijs klein">${where(x)} · ${new Date(x.at).toLocaleTimeString(locale(), {hour:"2-digit",minute:"2-digit"})}</span></div>
        ${x.text ? `<div class="tekst">${esc(x.text.length > 240 ? x.text.slice(0,240)+"…" : x.text)}</div>` : ""}
        ${x.note ? `<div class="noot klein">→ ${esc(x.note)}</div>` : ""}</li>`).join("")}</ol>`
      : `<p class="klein grijs">${esc(L.inboxEmpty)}</p>`}
  </section>`;
}
function renderLive(){
  if(!LIVE || D.focus) return;
  const a = $("#bf-acties-slot"), b = $("#bf-inbox-slot");
  if(a){
    a.innerHTML = actionsHtml();
    const k = $("#bf-keur"), ja = $("#bf-ja"), nee = $("#bf-nee");
    if(k) k.addEventListener("click", () => { confirming = true; renderLive(); const j = $("#bf-ja"); if(j) j.focus(); });
    if(nee) nee.addEventListener("click", () => { confirming = false; renderLive(); const k2 = $("#bf-keur"); if(k2) k2.focus(); });
    if(ja) ja.addEventListener("click", () => {
      const stage = STOP_STAGE[D.phase];
      post({type: stage==="review" ? "accept" : "approve", stage}, ja).then(() => { confirming = false; renderLive(); });
    });
  }
  if(b){ b.innerHTML = inboxHtml(); bindBoxes(b); }
}
// re-render without losing scroll position, open sections, focus or the caret in a feedback box
function preserve(fn){
  const a = document.activeElement, id = a && a.id, s = a && a.selectionStart, e = a && a.selectionEnd, y = window.scrollY;
  const open = [...document.querySelectorAll("details[id]")].map(d => [d.id, d.open]);
  fn();
  open.forEach(([i,o]) => { const d = document.getElementById(i); if(d && i !== activeOverride) d.open = o; });
  if(id){ const n = document.getElementById(id); if(n && n !== document.activeElement){ n.focus({preventScroll:true}); if(s != null && n.setSelectionRange) try{ n.setSelectionRange(s, e); }catch(_){} } }
  window.scrollTo(0, y);
}
function loadInbox(){
  return api("/api/inbox").then(res => {
    if(res.status===200 && res.j.items){ INBOX = res.j.items; preserve(renderLive); }
    else if(res.status===403 && !staleWarned){ staleWarned = true; toast(L.errToken, true); }
  }).catch(() => {});
}
function loadData(){
  return fetch("data.json?" + Date.now(), {cache:"no-store"}).then(r => r.json()).then(n => {
    n.cost = n.cost || D.cost; D = n; lastData = new Date(); confirming = false; preserve(render);
  });
}
function poll(){
  // typing in a box: wait a moment so a refresh never lands in the middle of a word
  if(Date.now() - lastInput < 1500) return setTimeout(poll, 800);
  fetch("/api/version", {cache:"no-store"}).then(r => r.json()).then(v => {
    setLive(true);
    const jobs = [];
    const old = VER; VER = v;
    if(v.inbox !== old.inbox) jobs.push(loadInbox());
    if(v.state !== old.state) jobs.push(loadData());
    return Promise.all(jobs);
  }).catch(() => setLive(false)).finally(() => setTimeout(poll, 2000));
}

if(!D){ document.getElementById("app").innerHTML = `<p style='padding:40px'>${esc(((navigator.language||"").startsWith("nl") ? T.nl : T.en).noData)}</p>`; return; }
if(D.overview){ renderOverview(); return; }
render();
// on first load, bring the active checkpoint into view, unless the page opened on an anchor or the user already moved
["wheel","touchstart","keydown","mousedown"].forEach(ev => addEventListener(ev, () => { userMoved = true; }, {once:true, passive:true}));
let autoScrolled = false;
function scrollToActive(again){
  if(D.focus || location.hash || userMoved || (again ? !autoScrolled : window.scrollY > 10)) return;
  const id = activeId(), el = id && document.getElementById(id);
  if(el){ el.scrollIntoView({block:"start"}); autoScrolled = true; }
}
requestAnimationFrame(() => scrollToActive(false));
if(location.protocol.startsWith("http") && !D.focus){
  if(TOKEN){
    // served by bf serve: interactive, and cheap refresh (poll a fingerprint, fetch data only when it changed)
    fetch("/api/ping", {cache:"no-store"}).then(r => r.json()).then(p => {
      if(!p.ok || p.slug !== D.slug) throw 0;
      LIVE = true; liveOk = true; preserve(render);
      scrollToActive(true);  // the live panels pushed the page down; correct the first-load scroll once
      autoScrolled = false; poll();
    }).catch(() => {});
  } else {
    // any other web server: plain refresh of data.json
    setInterval(() => fetch("data.json?"+Date.now()).then(r=>r.json()).then(n => {
      if(n.updated_at !== D.updated_at && !document.activeElement.matches("textarea")){ n.cost = n.cost || D.cost; D = n; render(); }
    }).catch(()=>{}), 4000);
  }
}
})();
</script>
